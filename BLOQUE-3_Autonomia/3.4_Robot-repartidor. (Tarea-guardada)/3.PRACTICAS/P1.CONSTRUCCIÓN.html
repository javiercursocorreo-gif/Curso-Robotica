<!-- MEJORAS TÉCNICAS Y DECISIONES:
  - Rotación Orbital Estricta: Se implementa exactamente el patrón del documento de conocimiento (angle += 0.004; camera.alpha = angle). La rotación es ininterrumpida durante toda la fase de puzzle y se detiene automáticamente al pasar a la fase de simulación (demo final).
  - Drag & Drop Nativo HTML5: Las piezas se instalan arrastrando los botones al lienzo 3D.
  - Entorno Infinito (Fog): Se utiliza FOGMODE_EXP2 con el color del clearColor para difuminar los bordes del plano base y eliminar el efecto de "suelo flotante".
  - Anclaje Visual (UX): Anillo holográfico que sirve como objetivo visual claro al inicio, cuando la escena está vacía.
  - Materiales y Renderizado PBR: Pipeline cinematográfico por defecto, materiales PBR con ClearCoat y gestión correcta de emissiveColor a través de GlowLayer.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>P1.CONSTRUCCION</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* HEADER OBLIGATORIO */
        header {
            flex-shrink: 0;
            height: 70px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid #00f2ff;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .title {
            font-size: 24px;
            color: #00f2ff;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 700;
        }
        .subtitle {
            font-size: 16px;
            color: #aaaaaa;
            margin: 0;
            margin-top: 4px;
        }

        /* CONTENEDOR PRINCIPAL */
        #main-content {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* LIENZO 3D (ZONA DROP) */
        #canvas-container {
            flex: 1;
            position: relative;
            transition: box-shadow 0.3s;
        }
        #canvas-container.drag-over {
            box-shadow: inset 0 0 50px rgba(0, 242, 255, 0.3);
        }
        
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
            outline: none;
        }

        /* TEXTO DE AYUDA INICIAL */
        #help-text {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaaaaa;
            font-size: 18px;
            pointer-events: none;
            background: rgba(0,0,0,0.6);
            padding: 12px 25px;
            border-radius: 20px;
            border: 1px solid #00f2ff;
            box-shadow: 0 0 15px rgba(0,242,255,0.2);
            z-index: 10;
        }

        /* PANEL LATERAL (GLASS-UI) */
        #ui-panel {
            width: 400px;
            flex-shrink: 0;
            background: rgba(20, 20, 30, 0.95);
            border-left: 2px solid #333;
            z-index: 90;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        
        #counter-text {
            font-size: 20px;
            color: #fff;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .panel-instruction {
            color: #aaaaaa;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* BOTONES DE PIEZAS */
        .btn-pieza {
            display: flex;
            align-items: center;
            min-height: 70px;
            padding: 0 20px;
            background: #2a2a35;
            border: 2px solid #555;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: grab;
            transition: all 0.3s ease;
            font-size: 18px;
            color: #ddd;
            font-weight: 500;
        }
        .btn-pieza:active {
            cursor: grabbing;
        }
        .btn-pieza:hover:not(.installed) {
            border-color: #888;
            background: #3a3a45;
        }
        .btn-pieza.installed {
            background: rgba(0, 242, 255, 0.15);
            border-color: #00f2ff;
            color: #00f2ff;
            cursor: default;
            pointer-events: auto;
        }
        .btn-pieza input[type="checkbox"] {
            width: 26px;
            height: 26px;
            margin-right: 20px;
            pointer-events: none;
            accent-color: #00f2ff;
        }

        /* BANNER FINAL */
        #banner {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f2ff;
            color: #000;
            padding: 20px 50px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,242,255,0.6);
            z-index: 100;
            display: none;
        }

        /* SCROLLBARS ACCESIBLES */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: #00f2ff; border-radius: 5px; }

    </style>
    <!-- CDN OBLIGATORIOS DE BABYLON.JS -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <header>
        <h1 class="title">ROBOT REPARTIDOR</h1>
        <h2 class="subtitle">Monta el robot pieza a pieza</h2>
    </header>

    <div id="main-content">
        <div id="canvas-container">
            <div id="help-text">Arrastra las piezas aquí para empezar</div>
            <canvas id="renderCanvas"></canvas>
            <div id="banner">¡ROBOT LISTO PARA REPARTIR!</div>
        </div>

        <div id="ui-panel">
            <div id="counter-text">0 / 9 piezas instaladas</div>
            <div class="panel-instruction">Arrastra las piezas al escenario:</div>
            <div id="pieces-list">
                <!-- Los botones se inyectan dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        // MOTOR Y ESCENA
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.10, 0.10, 0.18, 1);

        // NIEBLA - Fondea el suelo con el espacio infinito
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.035;
        scene.fogColor = new BABYLON.Color3(0.10, 0.10, 0.18);

        // CÁMARA
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 10, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 4; 
        camera.upperRadiusLimit = 25;
        camera.wheelPrecision = 50;

        // ILUMINACIÓN CINEMATOGRÁFICA
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
        hemi.intensity = 0.6;
        hemi.groundColor = new BABYLON.Color3(0.1, 0.1, 0.15);
        
        const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1,-2,-1), scene);
        dirLight.position = new BABYLON.Vector3(10, 20, 10);
        dirLight.intensity = 3.0;

        // SOMBRAS
        const shadowGen = new BABYLON.ShadowGenerator(2048, dirLight);
        shadowGen.useBlurExponentialShadowMap = true;
        shadowGen.blurKernel = 32;

        // POST-PROCESADO Y GLOW
        const glow = new BABYLON.GlowLayer("glow", scene);
        glow.intensity = 0.8;

        const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
        pipeline.msaaSamples = 4;
        pipeline.bloomEnabled = true;
        pipeline.bloomThreshold = 0.8;
        pipeline.bloomWeight = 0.4;
        pipeline.bloomKernel = 64;
        pipeline.bloomScale = 0.5;
        pipeline.vignetteEnabled = true;
        pipeline.vignetteWeight = 1.5;

        // SUELO
        const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:40, height:40}, scene);
        const groundMat = new BABYLON.PBRMaterial("groundMat", scene);
        groundMat.albedoColor = new BABYLON.Color3(0.15, 0.15, 0.15);
        groundMat.roughness = 0.9; 
        groundMat.metallic = 0.0;
        ground.material = groundMat;
        ground.receiveShadows = true;

        // ZONA DE ENSAMBLAJE (Anillo guía inicial)
        const buildRing = BABYLON.MeshBuilder.CreateTorus("buildRing", {diameter: 3.5, thickness: 0.03, tessellation: 64}, scene);
        buildRing.position.y = 0.015;
        const ringMat = new BABYLON.PBRMaterial("ringMat", scene);
        ringMat.emissiveColor = new BABYLON.Color3(0, 0.95, 1);
        ringMat.alpha = 0.3;
        ringMat.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
        ringMat.unlit = true;
        buildRing.material = ringMat;

        // MATERIALES PBR
        const matChasis = new BABYLON.PBRMaterial("matChasis", scene);
        matChasis.albedoColor = BABYLON.Color3.FromHexString("#FF6B35");
        matChasis.metallic = 0.3; 
        matChasis.roughness = 0.4;
        matChasis.clearCoat.isEnabled = true;
        matChasis.clearCoat.intensity = 1.0;
        matChasis.clearCoat.roughness = 0.1;

        const matRueda = new BABYLON.PBRMaterial("matRueda", scene);
        matRueda.albedoColor = BABYLON.Color3.FromHexString("#2C3E50");
        matRueda.metallic = 0.6; 
        matRueda.roughness = 0.6;

        const matCaja = new BABYLON.PBRMaterial("matCaja", scene);
        matCaja.albedoColor = BABYLON.Color3.FromHexString("#00BFA5");
        matCaja.metallic = 0.1; 
        matCaja.roughness = 0.5;

        const matSensor = new BABYLON.PBRMaterial("matSensor", scene);
        matSensor.albedoColor = BABYLON.Color3.FromHexString("#FFD700");
        matSensor.metallic = 0.2; 
        matSensor.roughness = 0.3;
        matSensor.emissiveColor = new BABYLON.Color3(0, 0, 0); 

        const matGPS = new BABYLON.PBRMaterial("matGPS", scene);
        matGPS.albedoColor = BABYLON.Color3.FromHexString("#9B59B6");
        matGPS.metallic = 0.7; 
        matGPS.roughness = 0.3;

        const matBateria = new BABYLON.PBRMaterial("matBateria", scene);
        matBateria.albedoColor = BABYLON.Color3.FromHexString("#E74C3C");
        matBateria.metallic = 0.4; 
        matBateria.roughness = 0.5;


        // DEFINICIÓN DE LAS PIEZAS DEL PUZZLE
        const robotGroup = new BABYLON.TransformNode("robotGroup", scene);
        
        let ruedasPivots = [];
        let tapaHingeNode = null;
        
        const createWheel = (id, x, y, z) => {
            const pivot = new BABYLON.TransformNode("pivot_" + id, scene);
            pivot.position = new BABYLON.Vector3(x, y, z);
            
            const wheel = BABYLON.MeshBuilder.CreateCylinder(id, {diameter: 0.28, height: 0.15}, scene);
            wheel.parent = pivot;
            wheel.rotation.z = Math.PI / 2;
            wheel.material = matRueda;
            
            ruedasPivots.push(pivot);
            return pivot;
        };

        const puzzlePieces = [
            { 
                id: 'chasis', 
                name: 'Chasis Principal', 
                build: () => {
                    const m = BABYLON.MeshBuilder.CreateBox("chasis", {width: 1.2, height: 0.25, depth: 1.8}, scene);
                    m.position.y = 0.125;
                    m.material = matChasis;
                    return m;
                }
            },
            { id: 'rdi', name: 'Rueda Delantera Izquierda', build: () => createWheel("rdi", -0.72, 0.14, 0.6) },
            { id: 'rdd', name: 'Rueda Delantera Derecha', build: () => createWheel("rdd", 0.72, 0.14, 0.6) },
            { id: 'rti', name: 'Rueda Trasera Izquierda', build: () => createWheel("rti", -0.72, 0.14, -0.6) },
            { id: 'rtd', name: 'Rueda Trasera Derecha', build: () => createWheel("rtd", 0.72, 0.14, -0.6) },
            { 
                id: 'caja', 
                name: 'Caja de Entrega', 
                build: () => {
                    const root = new BABYLON.TransformNode("caja_root", scene);
                    root.position.y = 0.525;
                    
                    const base = BABYLON.MeshBuilder.CreateBox("caja_base", {width: 0.9, height: 0.55, depth: 1.1}, scene);
                    base.parent = root;
                    base.material = matCaja;
                    
                    tapaHingeNode = new BABYLON.TransformNode("tapaHinge", scene);
                    tapaHingeNode.parent = root;
                    tapaHingeNode.position = new BABYLON.Vector3(0, 0.275, -0.55);
                    
                    const tapa = BABYLON.MeshBuilder.CreateBox("tapa", {width: 0.9, height: 0.05, depth: 1.1}, scene);
                    tapa.parent = tapaHingeNode;
                    tapa.position = new BABYLON.Vector3(0, 0.025, 0.55); 
                    tapa.material = matCaja;
                    
                    return root;
                }
            },
            { 
                id: 'sensor', 
                name: 'Sensor Frontal', 
                build: () => {
                    const m = BABYLON.MeshBuilder.CreateBox("sensor", {width: 0.5, height: 0.12, depth: 0.06}, scene);
                    m.position = new BABYLON.Vector3(0, 0.4, 0.93);
                    m.material = matSensor;
                    return m;
                }
            },
            { 
                id: 'gps', 
                name: 'Módulo GPS / WiFi', 
                build: () => {
                    const m = BABYLON.MeshBuilder.CreateCylinder("gps", {diameter: 0.08, height: 0.35}, scene);
                    m.position = new BABYLON.Vector3(0, 1.1, -0.3);
                    m.material = matGPS;
                    return m;
                }
            },
            { 
                id: 'bateria', 
                name: 'Batería de Energía', 
                build: () => {
                    const m = BABYLON.MeshBuilder.CreateBox("bateria", {width: 0.7, height: 0.18, depth: 0.9}, scene);
                    m.position = new BABYLON.Vector3(0, 0.09, 0);
                    m.material = matBateria;
                    return m;
                }
            }
        ];

        // LÓGICA DE INTERFAZ Y DRAG & DROP
        const installedPieces = {};
        let installedCount = 0;
        let isSimulationActive = false;
        
        const panelList = document.getElementById('pieces-list');
        const counterText = document.getElementById('counter-text');
        const helpText = document.getElementById('help-text');
        const canvasContainer = document.getElementById('canvas-container');

        // Generar UI con soporte Drag
        puzzlePieces.forEach(piece => {
            const btn = document.createElement('div');
            btn.className = 'btn-pieza';
            btn.id = `btn-${piece.id}`;
            btn.setAttribute('draggable', 'true');
            btn.innerHTML = `
                <input type="checkbox" id="chk-${piece.id}">
                <span>${piece.name}</span>
            `;
            
            // Iniciar arrastre
            btn.addEventListener('dragstart', (e) => {
                if (installedPieces[piece.id]) {
                    e.preventDefault();
                    return;
                }
                e.dataTransfer.setData('text/plain', piece.id);
                e.dataTransfer.effectAllowed = 'copy';
            });

            panelList.appendChild(btn);
        });

        // Configurar Zona de Caída (Dropzone)
        canvasContainer.addEventListener('dragover', (e) => {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'copy';
            canvasContainer.classList.add('drag-over');
        });

        canvasContainer.addEventListener('dragleave', () => {
            canvasContainer.classList.remove('drag-over');
        });

        canvasContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            canvasContainer.classList.remove('drag-over');
            
            const pieceId = e.dataTransfer.getData('text/plain');
            if (pieceId) {
                installPiece(pieceId);
            }
        });

        function installPiece(id) {
            if (installedPieces[id]) return; 
            installedPieces[id] = true;
            
            // Ocultar textos y ayudas iniciales
            helpText.style.display = 'none';
            if (buildRing) buildRing.dispose();

            // Construir pieza 3D
            const def = puzzlePieces.find(p => p.id === id);
            const rootNode = def.build();
            rootNode.parent = robotGroup;
            
            // Sombras
            if (rootNode instanceof BABYLON.AbstractMesh) {
                shadowGen.addShadowCaster(rootNode);
            }
            rootNode.getChildMeshes(false).forEach(m => shadowGen.addShadowCaster(m));

            // Actualizar botón UI
            const btn = document.getElementById(`btn-${id}`);
            btn.classList.add('installed');
            btn.setAttribute('draggable', 'false'); 
            document.getElementById(`chk-${id}`).checked = true;
            
            installedCount++;
            counterText.innerText = `${installedCount} / 9 piezas instaladas`;

            // Animación pop-up de la pieza
            let t0 = performance.now();
            const popAnim = () => {
                const now = performance.now();
                const p = Math.min((now - t0) / 500, 1);
                
                const s = 0.01 + 0.99 * p;
                rootNode.scaling = new BABYLON.Vector3(s, s, s);
                
                if (p >= 1) {
                    rootNode.scaling = new BABYLON.Vector3(1, 1, 1);
                    scene.onBeforeRenderObservable.removeCallback(popAnim);
                    
                    if (installedCount === puzzlePieces.length) {
                        launchCompleteSimulation();
                    }
                }
            };
            scene.onBeforeRenderObservable.add(popAnim);
        }

        function launchCompleteSimulation() {
            if (isSimulationActive) return;
            isSimulationActive = true;
            
            const banner = document.getElementById('banner');
            banner.style.display = 'block';
        }

        // CONTROL DE ANIMACIONES DEL ROBOT Y LA CÁMARA
        let angle = -Math.PI / 2;
        let blinkTimer = 0;

        scene.onBeforeRenderObservable.add(() => {
            const dt = engine.getDeltaTime() / 1000;
            
            // REGLA OBLIGATORIA DEL DOCUMENTO: 
            // Rotación orbital ininterrumpida durante construcción.
            // Se detiene únicamente al iniciar la demo (cuando están todas las piezas).
            if (!isSimulationActive) {
                angle += 0.004;
                camera.alpha = angle;
            } else {
                // Animaciones de robot completado (Demo)
                ruedasPivots.forEach(pivot => {
                    pivot.rotation.x += 4.5 * dt; 
                });

                blinkTimer += dt;
                if (blinkTimer % 0.6 < 0.3) {
                    matSensor.emissiveColor = new BABYLON.Color3(1, 0.85, 0);
                } else {
                    matSensor.emissiveColor = new BABYLON.Color3(0, 0, 0);
                }

                if (tapaHingeNode && tapaHingeNode.rotation.x < Math.PI / 2) {
                    tapaHingeNode.rotation.x += 1.5 * dt;
                    if (tapaHingeNode.rotation.x > Math.PI / 2) {
                        tapaHingeNode.rotation.x = Math.PI / 2;
                    }
                }
            }
        });

        // BUCLE PRINCIPAL
        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener('resize', () => {
            engine.resize();
        });

    </script>
</body>
</html>
