<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codi-Oruga Simulación</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #1a1a2e;
            --panel: rgba(0, 0, 0, 0.85);
            --btn-h: 80px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 70px;
            background: var(--panel);
            border-bottom: 2px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        header h1 { margin: 0; font-size: 24px; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        header p { margin: 0; font-size: 15px; color: #aaa; }

        main { display: flex; flex: 1; overflow: hidden; }

        .side-panel {
            width: 280px;
            background: rgba(20, 20, 35, 0.9);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid #333;
            overflow-y: auto;
        }

        .side-panel.right { border-right: none; border-left: 1px solid #333; }

        .btn-segment {
            height: var(--btn-h);
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s;
        }

        .btn-segment:active { transform: scale(0.95); }
        .btn-forward { background-color: #2ecc71; }
        .btn-left { background-color: #3498db; }
        .btn-right { background-color: #e67e22; }
        .btn-remove { background-color: #e74c3c; height: 60px; font-size: 18px; }
        .btn-execute { background-color: #27ae60; font-size: 24px; margin-top: 10px; }

        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d1a;
            position: relative;
        }

        canvas { background-color: #111; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .mission-box {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--primary);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .mission-box h3 { margin: 0; color: var(--primary); font-size: 20px; }
        .mission-box p { margin: 5px 0 0 0; font-size: 18px; line-height: 1.3; }

        .piece-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            min-height: 100px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        #toast {
            position: absolute;
            bottom: 40px;
            padding: 15px 30px;
            background: var(--primary);
            color: black;
            font-weight: bold;
            font-size: 20px;
            border-radius: 50px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

<header>
    <h1>CODI-ORUGA · CONECTA LOS SEGMENTOS</h1>
    <p>Ensambla el cuerpo de la oruga haciendo clic en las piezas</p>
</header>

<main>
    <aside class="side-panel">
        <h2>PIEZAS</h2>
        <button class="btn-segment btn-forward" onclick="addSegment('FORWARD')">🟢 ADELANTE ↑</button>
        <button class="btn-segment btn-left" onclick="addSegment('LEFT')">🔵 IZQ ↰</button>
        <button class="btn-segment btn-right" onclick="addSegment('RIGHT')">🟠 DER ↱</button>
        <hr style="width:100%; border: 0; border-top: 1px solid #444;">
        <button class="btn-segment btn-remove" onclick="removeLast()">❌ QUITAR ÚLTIMO</button>
    </aside>

    <section id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="toast"></div>
    </section>

    <aside class="side-panel right">
        <div class="mission-box" id="mission-info">
            <h3 id="m-title">MISIÓN 1</h3>
            <p id="m-desc">Añade 3 segmentos ADELANTE y llega a la flor.</p>
        </div>
        <h2>MI ORUGA</h2>
        <div class="piece-list" id="visual-list"></div>
        <button class="btn-segment btn-execute" id="btn-run" onclick="executeSequence()">▶ EJECUTAR</button>
        <button class="btn-segment" style="background:#7f8c8d; height: 60px;" onclick="resetSimulation()">🔄 REINICIAR</button>
    </aside>
</main>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID = 14;
    let cellSize, segments = [], trail = [], headPos, headDir, isRunning = false;
    let currentMission = 1;

    const missions = {
        1: { title: "MISIÓN 1", desc: "Añade 3 segmentos ADELANTE y llega a la flor.", target: {x: 7, y: 7}, start: {x: 7, y: 10, dir: 0} },
        2: { title: "MISIÓN 2", desc: "La flor está a la derecha. Tendrás que girar.", target: {x: 10, y: 8}, start: {x: 7, y: 8, dir: 0} },
        3: { title: "MISIÓN 3", desc: "Ensambla el cuerpo de la oruga haciendo clic en las piezas para formar una espiral", target: {x: -1, y: -1}, start: {x: 7, y: 7, dir: 0} }
    };

    function init() {
        const size = Math.min(canvas.parentElement.clientWidth, canvas.parentElement.clientHeight) - 40;
        canvas.width = canvas.height = size;
        cellSize = size / GRID;
        resetSimulation();
        window.onresize = init;
    }

    function addSegment(type) {
        if(isRunning) return;
        segments.push(type);
        updateUI();
        draw();
    }

    function removeLast() { if(!isRunning) { segments.pop(); updateUI(); draw(); } }

    function updateUI() {
        const list = document.getElementById('visual-list');
        list.innerHTML = segments.map(s => {
            let color = s=='FORWARD' ? '#2ecc71' : s=='LEFT' ? '#3498db' : '#e67e22';
            return `<div style="width:35px;height:35px;background:${color};border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:bold;">${s=='FORWARD'?'↑':s=='LEFT'?'↰':'↱'}</div>`;
        }).join('');
    }

    function resetSimulation() {
        const m = missions[currentMission];
        headPos = {...m.start};
        headDir = m.start.dir;
        trail = [{x: headPos.x, y: headPos.y}];
        isRunning = false;
        document.getElementById('m-title').innerText = m.title;
        document.getElementById('m-desc').innerText = m.desc;
        draw();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    async function executeSequence() {
        if(segments.length === 0 || isRunning) return;
        isRunning = true;
        const m = missions[currentMission];
        headPos = {...m.start}; headDir = m.start.dir; trail = [{x: headPos.x, y: headPos.y}];

        for(let s of segments) {
            if(s === 'FORWARD') {
                if(headDir===0) headPos.y--; else if(headDir===1) headPos.x++;
                else if(headDir===2) headPos.y++; else headPos.x--;
            } else if(s === 'LEFT') headDir = (headDir + 3) % 4;
            else if(s === 'RIGHT') headDir = (headDir + 1) % 4;

            trail.push({...headPos});
            draw();
            if(headPos.x < 0 || headPos.x >= GRID || headPos.y < 0 || headPos.y >= GRID) {
                showToast("⚠️ ¡La oruga se salió!"); break;
            }
            await new Promise(r => setTimeout(r, 600));
        }
        checkWin();
        isRunning = false;
    }

    function checkWin() {
        const m = missions[currentMission];
        if(m.target.x !== -1 && headPos.x === m.target.x && headPos.y === m.target.y) {
            showToast("✨ ¡OBJETIVO COMPLETADO! ✨");
            setTimeout(() => { currentMission = currentMission < 3 ? currentMission + 1 : 1; segments=[]; updateUI(); resetSimulation(); }, 2000);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#222';
        for(let i=0; i<=GRID; i++) {
            ctx.beginPath(); ctx.moveTo(i*cellSize, 0); ctx.lineTo(i*cellSize, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i*cellSize); ctx.lineTo(canvas.width, i*cellSize); ctx.stroke();
        }
        const m = missions[currentMission];
        if(m.target.x !== -1) {
            ctx.font = `${cellSize*0.7}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🌸', m.target.x*cellSize + cellSize/2, m.target.y*cellSize + cellSize/2);
        }
        trail.forEach((p, i) => {
            ctx.fillStyle = i === trail.length - 1 ? '#f1c40f' : '#2ecc71';
            ctx.beginPath();
            ctx.roundRect(p.x*cellSize+4, p.y*cellSize+4, cellSize-8, cellSize-8, 10);
            ctx.fill();
        });
    }
    init();
</script>
</body>
</html>
