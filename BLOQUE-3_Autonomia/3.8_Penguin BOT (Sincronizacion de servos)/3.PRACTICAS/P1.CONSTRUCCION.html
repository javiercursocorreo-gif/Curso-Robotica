<!-- MEJORAS:
- Rediseño estructural cinemático: Se ha construido un esqueleto (TransformNodes) con pivotes reales en las caderas y tobillos para simular físicamente las articulaciones.
- Física del balanceo (Waddling) en 4 tiempos: Animación matemática mediante funciones senoidales desfasadas. Las caderas avanzan de forma alterna mientras el cuerpo se balancea lateralmente y los tobillos contrarrestan el giro para mantener los pies paralelos al suelo.
- Geometría de los Servomotores: Inclusión explícita de los 4 motores azules (2 caderas, 2 tobillos) simulando los servos TowerPro del robot real.
- Diseño visual fiel a la imagen: Carcasa roja hueca, soportes en "U", base ancha de los pies, placa inferior y rostro completo (ojos de sensor ultrasónico plateados y sonrisa negra incrustada).
- Arquitectura procedimental pura en Babylon.js (sin modelos externos) con Materiales PBR e iluminación cinematográfica.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>P1.CONSTRUCCION</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #ffffff;
        }

        /* HEADER */
        header {
            height: 70px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid #00f2ff;
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: #00f2ff;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        header p {
            margin: 0 0 0 20px;
            font-size: 18px;
            color: #aaaaaa;
        }

        /* LAYOUT PRINCIPAL - FLEXBOX */
        #main-layout {
            display: flex;
            height: calc(100vh - 70px);
            width: 100%;
        }

        /* CONTENEDOR DEL CANVAS */
        #canvas-container {
            flex: 1;
            height: 100%;
            position: relative;
            transition: box-shadow 0.3s ease;
        }

        #canvas-container.drop-hover {
            box-shadow: inset 0 0 50px rgba(0, 242, 255, 0.5);
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* CONFETI Y BANNER FINAL */
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        #banner-completado {
            display: none;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 24, 30, 0.85);
            border: 2px solid #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            color: #00f2ff;
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            z-index: 60;
        }

        #banner-completado h2 {
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #banner-completado p {
            margin: 10px 0 0 0;
            font-size: 20px;
            color: #ffffff;
        }

        /* PANEL LATERAL DE PIEZAS */
        #ui-panel {
            width: 400px;
            flex-shrink: 0;
            background: rgba(10, 10, 20, 0.95);
            border-left: 2px solid #00f2ff;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .panel-title {
            font-size: 22px;
            color: #00f2ff;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .piece-btn {
            background: #2a2a40;
            border: 2px dashed #555;
            border-radius: 8px;
            color: #fff;
            min-height: 75px; 
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: grab;
            transition: all 0.2s;
            text-align: left;
        }

        .piece-btn:hover {
            border-color: #00f2ff;
            background: #333355;
        }

        .piece-btn:active {
            cursor: grabbing;
        }

        .piece-btn.installed {
            background: #11111a;
            border-color: #00f2ff;
            border-style: solid;
            color: #777;
            cursor: default;
        }

        .piece-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .piece-desc {
            font-size: 16px;
            color: #aaa;
        }

        .installed .piece-title, .installed .piece-desc {
            color: #00f2ff;
            opacity: 0.6;
        }
    </style>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <header>
        <h1>P1.CONSTRUCCION</h1>
        <p>Monta tu Robot arrastrando las piezas al área central.</p>
    </header>

    <div id="main-layout">
        <div id="canvas-container">
            <canvas id="renderCanvas"></canvas>
            <canvas id="confettiCanvas"></canvas>
            <div id="banner-completado">
                <h2>¡ROBOT COMPLETADO!</h2>
                <p>El robot camina balanceándose de forma autónoma.</p>
            </div>
        </div>

        <div id="ui-panel">
            <div class="panel-title">Caja de Piezas (Arrastrar)</div>
            
            <button class="piece-btn" id="btn-p1" draggable="true" title="Estructura que da forma al cuerpo y contiene la sonrisa.">
                <div class="piece-title">Carcasa principal</div>
                <div class="piece-desc">Cuerpo rojo del robot con sonrisa</div>
            </button>
            <button class="piece-btn" id="btn-p2" draggable="true" title="Incluye el servo azul superior y el soporte que baja a la pierna.">
                <div class="piece-title">Cadera Izquierda</div>
                <div class="piece-desc">Servo superior y brazo izquierdo</div>
            </button>
            <button class="piece-btn" id="btn-p3" draggable="true" title="Incluye el servo azul superior y el soporte que baja a la pierna.">
                <div class="piece-title">Cadera Derecha</div>
                <div class="piece-desc">Servo superior y brazo derecho</div>
            </button>
            <button class="piece-btn" id="btn-p4" draggable="true" title="Servo inferior y base de apoyo plana. Contrarresta el giro.">
                <div class="piece-title">Pie y Tobillo Izq.</div>
                <div class="piece-desc">Servo inferior y base izquierda</div>
            </button>
            <button class="piece-btn" id="btn-p5" draggable="true" title="Servo inferior y base de apoyo plana. Contrarresta el giro.">
                <div class="piece-title">Pie y Tobillo Der.</div>
                <div class="piece-desc">Servo inferior y base derecha</div>
            </button>
            <button class="piece-btn" id="btn-p6" draggable="true" title="Coordina todos los motores y sensores. Va dentro del cuerpo.">
                <div class="piece-title">Placa controladora</div>
                <div class="piece-desc">Cerebro electrónico</div>
            </button>
            <button class="piece-btn" id="btn-p7" draggable="true" title="Da energía a todo el robot.">
                <div class="piece-title">Batería interna</div>
                <div class="piece-desc">Fuente de alimentación</div>
            </button>
            <button class="piece-btn" id="btn-p8" draggable="true" title="Sensores plateados que actúan como los ojos del robot.">
                <div class="piece-title">Sensor ultrasónico</div>
                <div class="piece-desc">Los "ojos" plateados del robot</div>
            </button>
            <button class="piece-btn" id="btn-p9" draggable="true" title="Tapa superior que cierra y protege los componentes internos.">
                <div class="piece-title">Tapa superior</div>
                <div class="piece-desc">Cierre de la cabeza</div>
            </button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN BABYLON.JS
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.10, 0.10, 0.18, 1);

        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.035;
        scene.fogColor = new BABYLON.Color3(0.10, 0.10, 0.18);

        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3.5, 14, BABYLON.Vector3.Zero(), scene);
        camera.lowerRadiusLimit = 4; 
        camera.upperRadiusLimit = 25;
        
        let angle = -Math.PI/2; 
        let completado = false;
        
        // LUCES Y POST-PROCESADO
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
        hemi.intensity = 0.6;
        hemi.groundColor = new BABYLON.Color3(0.1, 0.1, 0.15);

        const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1,-2,-0.5), scene);
        dirLight.position = new BABYLON.Vector3(20,40,20); 
        dirLight.intensity = 2.5;
        
        const shadowGen = new BABYLON.ShadowGenerator(2048, dirLight);
        shadowGen.useBlurExponentialShadowMap = true; 
        shadowGen.blurKernel = 32;

        const glow = new BABYLON.GlowLayer("glow", scene); 
        glow.intensity = 0.8;

        const pipeline = new BABYLON.DefaultRenderingPipeline("pp", true, scene, [camera]);
        pipeline.msaaSamples = 4; 
        pipeline.bloomEnabled = true;
        pipeline.bloomThreshold = 0.85; 
        pipeline.bloomWeight = 0.35;
        
        scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(
            "https://playground.babylonjs.com/textures/environment.dds", scene);
        scene.environmentIntensity = 0.6;

        // SUELO
        const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:40, height:40}, scene);
        const groundMat = new BABYLON.PBRMaterial("groundMat", scene);
        groundMat.albedoColor = new BABYLON.Color3(0.15, 0.15, 0.15);
        groundMat.roughness = 0.9; 
        groundMat.metallic = 0.0;
        ground.material = groundMat; 
        ground.receiveShadows = true;

        // MATERIALES GLOBALES (Fieles a la imagen de referencia)
        const matRed = new BABYLON.PBRMaterial("matRed", scene);
        matRed.albedoColor = BABYLON.Color3.FromHexString("#E52020");
        matRed.roughness = 0.3; matRed.metallic = 0.0;

        const matDark = new BABYLON.PBRMaterial("matDark", scene);
        matDark.albedoColor = BABYLON.Color3.FromHexString("#151515");
        matDark.roughness = 0.7; matDark.metallic = 0.1;

        const matSilver = new BABYLON.PBRMaterial("matSilver", scene);
        matSilver.albedoColor = BABYLON.Color3.FromHexString("#E0E0E0");
        matSilver.roughness = 0.15; matSilver.metallic = 0.9;

        const matBlue = new BABYLON.PBRMaterial("matBlue", scene); // Servomotores
        matBlue.albedoColor = BABYLON.Color3.FromHexString("#1030B0");
        matBlue.roughness = 0.4; matBlue.metallic = 0.1;

        const matWhite = new BABYLON.PBRMaterial("matWhite", scene);
        matWhite.albedoColor = BABYLON.Color3.FromHexString("#F0F0F0");
        matWhite.roughness = 0.9; matWhite.metallic = 0.0;

        // ------------------------------------------------------------------
        // ESQUELETO CINEMÁTICO (Nodos invisibles para la animación)
        // ------------------------------------------------------------------
        const robotGroup = new BABYLON.TransformNode("robotGroup", scene); // Contenedor global de avance
        
        const bodyPivot = new BABYLON.TransformNode("bodyPivot", scene); // Pivote central (altura del cuerpo)
        bodyPivot.parent = robotGroup;
        bodyPivot.position.y = 2.1; // Elevación base del cuerpo

        // CADERAS (Rotan en X para avanzar la pierna)
        const hipL = new BABYLON.TransformNode("hipL", scene);
        hipL.parent = bodyPivot;
        hipL.position = new BABYLON.Vector3(0.65, -0.6, 0);

        const hipR = new BABYLON.TransformNode("hipR", scene);
        hipR.parent = bodyPivot;
        hipR.position = new BABYLON.Vector3(-0.65, -0.6, 0);

        // TOBILLOS (Rotan en Z para mantener los pies planos al balancearse)
        const ankleL = new BABYLON.TransformNode("ankleL", scene);
        ankleL.parent = hipL;
        ankleL.position = new BABYLON.Vector3(0, -1.05, 0);

        const ankleR = new BABYLON.TransformNode("ankleR", scene);
        ankleR.parent = hipR;
        ankleR.position = new BABYLON.Vector3(0, -1.05, 0);

        // INDICADOR HOLOGRÁFICO (Se destruye al instalar la primera pieza)
        const indicator = BABYLON.MeshBuilder.CreateTorus("indicator", {diameter:3.5, thickness:0.06, tessellation:48}, scene);
        indicator.position.y = 0.1;
        const iMat = new BABYLON.PBRMaterial("iMat", scene);
        iMat.emissiveColor = new BABYLON.Color3(0, 0.9, 1); 
        iMat.roughness = 0; iMat.metallic = 0; iMat.alpha = 0.6;
        iMat.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
        indicator.material = iMat;

        // ANIMACIÓN DEL BUCLE PRINCIPAL (Balanceo y giro de cámara)
        scene.onBeforeRenderObservable.add(() => {
            if(!completado) { 
                // Giro automático durante construcción
                angle += 0.004; 
                camera.alpha = angle; 
                if (indicator && !indicator.isDisposed()) {
                    indicator.rotation.y += 0.02;
                }
            } else {
                // ANIMACIÓN FÍSICA EN 4 TIEMPOS (Waddling Mode)
                const t = (performance.now() / 1000) * 5; // Velocidad del ciclo
                
                // 1. Balanceo lateral del cuerpo (Roll)
                const maxTilt = 0.22; // radianes de inclinación
                bodyPivot.rotation.z = Math.sin(t) * maxTilt; 
                
                // 2. Rebote vertical para simular el cambio de peso
                const baseHeight = 2.1;
                bodyPivot.position.y = baseHeight + Math.abs(Math.sin(t)) * 0.12; 

                // 3. Movimiento de las caderas (Pitch - Avance alterno)
                // Cuando se inclina a la izq (sin positivo), la pierna derecha avanza
                hipL.rotation.x = -Math.cos(t) * 0.35; 
                hipR.rotation.x = Math.cos(t) * 0.35;  

                // 4. Tobillos compensan el balanceo para mantener los pies planos
                ankleL.rotation.z = -bodyPivot.rotation.z;
                ankleR.rotation.z = -bodyPivot.rotation.z;

                // 5. Avance continuo del robot en Z global
                robotGroup.position.z -= 0.012; // Avanza hacia adelante
                camera.target = bodyPivot.getAbsolutePosition(); 
            }
        });

        // GESTIÓN DE PIEZAS (Drag & Drop)
        const instaladas = {
            p1: false, p2: false, p3: false, p4: false, p5: false,
            p6: false, p7: false, p8: false, p9: false
        };

        const canvasContainer = document.getElementById('canvas-container');
        document.querySelectorAll('.piece-btn').forEach(btn => {
            btn.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('pieza-id', btn.id.replace('btn-', ''));
            });
        });

        canvasContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            canvasContainer.classList.add('drop-hover');
        });

        canvasContainer.addEventListener('dragleave', () => {
            canvasContainer.classList.remove('drop-hover');
        });

        canvasContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            canvasContainer.classList.remove('drop-hover');
            const id = e.dataTransfer.getData('pieza-id');
            if (id) installPiece(id);
        });

        function installPiece(id) {
            if (instaladas[id]) return;
            instaladas[id] = true;

            if (indicator && !indicator.isDisposed()) indicator.dispose();

            const btn = document.getElementById('btn-' + id);
            btn.classList.add('installed');
            btn.setAttribute('draggable', 'false');

            // Crear la malla procedural
            const piezaNode = createPieceMesh(id);
            
            // Asignar parent según jerarquía cinemática
            switch(id) {
                case 'p1': case 'p6': case 'p7': case 'p8': case 'p9':
                    piezaNode.parent = bodyPivot; break;
                case 'p2': piezaNode.parent = hipL; break;
                case 'p3': piezaNode.parent = hipR; break;
                case 'p4': piezaNode.parent = ankleL; break;
                case 'p5': piezaNode.parent = ankleR; break;
            }
            
            piezaNode.getChildMeshes(false).forEach(m => shadowGen.addShadowCaster(m));

            // Animación de Aparición Pop (Vector3 directo)
            piezaNode.scaling = new BABYLON.Vector3(0.01, 0.01, 0.01);
            let t0 = performance.now();
            
            const popAnim = () => {
                const p = Math.min((performance.now() - t0) / 500, 1);
                const s = 0.01 + 0.99 * p;
                piezaNode.scaling = new BABYLON.Vector3(s, s, s);
                if (p >= 1) { 
                    piezaNode.scaling = new BABYLON.Vector3(1, 1, 1); 
                    scene.onBeforeRenderObservable.removeCallback(popAnim); 
                    checkCompletion();
                }
            };
            scene.onBeforeRenderObservable.add(popAnim);
        }

        // CONSTRUCCIÓN PROCEDURAL DE LAS 9 PIEZAS BASADA EN LA IMAGEN
        function createPieceMesh(id) {
            const group = new BABYLON.TransformNode("group_" + id, scene);

            switch(id) {
                case 'p1': // CARCASA PRINCIPAL (Cara y cuerpo)
                    // Placa delantera con los "mofletes"
                    const front = BABYLON.MeshBuilder.CreateBox("front", {width: 2.8, height: 1.8, depth: 0.08}, scene);
                    front.position = new BABYLON.Vector3(0, 0, -0.65); // Frente hacia Z-
                    front.material = matRed;
                    front.parent = group;

                    // Sonrisa Negra (Tubo curvado incrustado)
                    const smilePath = [
                        new BABYLON.Vector3(0.4, 0, 0),
                        new BABYLON.Vector3(0.25, -0.15, 0),
                        new BABYLON.Vector3(0, -0.2, 0),
                        new BABYLON.Vector3(-0.25, -0.15, 0),
                        new BABYLON.Vector3(-0.4, 0, 0)
                    ];
                    const smile = BABYLON.MeshBuilder.CreateTube("smile", {path: smilePath, radius: 0.06, tessellation: 16}, scene);
                    smile.position = new BABYLON.Vector3(0, -0.4, -0.68);
                    smile.material = matDark;
                    smile.parent = group;

                    // Laterales redondeados (simulados con cilindros + cajas)
                    const leftPanel = BABYLON.MeshBuilder.CreateBox("left", {width: 0.1, height: 1.8, depth: 1.4}, scene);
                    leftPanel.position = new BABYLON.Vector3(1.35, 0, 0);
                    leftPanel.material = matRed; leftPanel.parent = group;

                    const rightPanel = BABYLON.MeshBuilder.CreateBox("right", {width: 0.1, height: 1.8, depth: 1.4}, scene);
                    rightPanel.position = new BABYLON.Vector3(-1.35, 0, 0);
                    rightPanel.material = matRed; rightPanel.parent = group;

                    const bottom = BABYLON.MeshBuilder.CreateBox("bottom", {width: 2.6, height: 0.08, depth: 1.2}, scene);
                    bottom.position = new BABYLON.Vector3(0, -0.86, 0);
                    bottom.material = matDark; // La base interna en la foto suele ser placa
                    bottom.parent = group;
                    break;

                case 'p2': // CADERA IZQUIERDA (Servo Superior + Brazo bajante)
                    // Servo de cadera (Azul)
                    const servoHipL = BABYLON.MeshBuilder.CreateBox("servoHipL", {width: 0.4, height: 0.5, depth: 0.3}, scene);
                    servoHipL.material = matBlue; servoHipL.parent = group;
                    
                    // Soporte metálico/plástico (Rojo) bajando hacia el tobillo
                    const strutL = BABYLON.MeshBuilder.CreateBox("strutL", {width: 0.15, height: 1.05, depth: 0.35}, scene);
                    strutL.position = new BABYLON.Vector3(-0.27, -0.52, 0);
                    strutL.material = matRed; strutL.parent = group;
                    break;

                case 'p3': // CADERA DERECHA (Simétrica)
                    const servoHipR = BABYLON.MeshBuilder.CreateBox("servoHipR", {width: 0.4, height: 0.5, depth: 0.3}, scene);
                    servoHipR.material = matBlue; servoHipR.parent = group;
                    
                    const strutR = BABYLON.MeshBuilder.CreateBox("strutR", {width: 0.15, height: 1.05, depth: 0.35}, scene);
                    strutR.position = new BABYLON.Vector3(0.27, -0.52, 0);
                    strutR.material = matRed; strutR.parent = group;
                    break;

                case 'p4': // PIE Y TOBILLO IZQUIERDO (Servo Inferior + Base plana)
                    // Servo de tobillo (Azul) incrustado en el pie
                    const servoAnkleL = BABYLON.MeshBuilder.CreateBox("servoAnkleL", {width: 0.4, height: 0.3, depth: 0.5}, scene);
                    servoAnkleL.position.y = 0.15;
                    servoAnkleL.material = matBlue; servoAnkleL.parent = group;

                    // Base del pie rojo
                    const footL = BABYLON.MeshBuilder.CreateBox("footL", {width: 1.2, height: 0.1, depth: 1.6}, scene);
                    footL.position = new BABYLON.Vector3(0, -0.05, 0.2);
                    footL.material = matRed; footL.parent = group;

                    // Almohadilla blanca inferior
                    const padL = BABYLON.MeshBuilder.CreateBox("padL", {width: 1.25, height: 0.05, depth: 1.65}, scene);
                    padL.position = new BABYLON.Vector3(0, -0.12, 0.2);
                    padL.material = matWhite; padL.parent = group;
                    break;

                case 'p5': // PIE Y TOBILLO DERECHO (Simétrico)
                    const servoAnkleR = BABYLON.MeshBuilder.CreateBox("servoAnkleR", {width: 0.4, height: 0.3, depth: 0.5}, scene);
                    servoAnkleR.position.y = 0.15;
                    servoAnkleR.material = matBlue; servoAnkleR.parent = group;

                    const footR = BABYLON.MeshBuilder.CreateBox("footR", {width: 1.2, height: 0.1, depth: 1.6}, scene);
                    footR.position = new BABYLON.Vector3(0, -0.05, 0.2);
                    footR.material = matRed; footR.parent = group;

                    const padR = BABYLON.MeshBuilder.CreateBox("padR", {width: 1.25, height: 0.05, depth: 1.65}, scene);
                    padR.position = new BABYLON.Vector3(0, -0.12, 0.2);
                    padR.material = matWhite; padR.parent = group;
                    break;

                case 'p6': // PLACA CONTROLADORA (Interior)
                    const board = BABYLON.MeshBuilder.CreateBox("board", {width: 2.2, height: 0.06, depth: 1.0}, scene);
                    board.position = new BABYLON.Vector3(0, -0.75, 0); // Reposa sobre el bottom
                    board.material = matDark; board.parent = group;

                    const chip = BABYLON.MeshBuilder.CreateBox("chip", {width: 0.4, height: 0.08, depth: 0.4}, scene);
                    chip.position = new BABYLON.Vector3(0, -0.7, 0);
                    chip.material = matSilver; chip.parent = group;
                    break;

                case 'p7': // BATERÍA
                    const battery = BABYLON.MeshBuilder.CreateBox("bat", {width: 0.8, height: 0.5, depth: 0.5}, scene);
                    battery.position = new BABYLON.Vector3(0, -0.4, 0);
                    battery.material = matDark; battery.parent = group;
                    break;

                case 'p8': // SENSOR ULTRASÓNICO (Ojos plateados)
                    // Base del sensor
                    const sensorBase = BABYLON.MeshBuilder.CreateBox("sensorBase", {width: 1.4, height: 0.6, depth: 0.05}, scene);
                    sensorBase.position = new BABYLON.Vector3(0, 0.2, -0.66);
                    sensorBase.material = matRed; sensorBase.parent = group;

                    // Ojo Izquierdo (Metálico)
                    const eyeL = BABYLON.MeshBuilder.CreateCylinder("eyeL", {diameter: 0.55, height: 0.15}, scene);
                    eyeL.rotation.x = Math.PI/2;
                    eyeL.position = new BABYLON.Vector3(0.4, 0.2, -0.72);
                    eyeL.material = matSilver; eyeL.parent = group;

                    // Interior oscuro ojo izq
                    const pupilL = BABYLON.MeshBuilder.CreateCylinder("pupilL", {diameter: 0.4, height: 0.16}, scene);
                    pupilL.rotation.x = Math.PI/2;
                    pupilL.position = new BABYLON.Vector3(0.4, 0.2, -0.72);
                    pupilL.material = matDark; pupilL.parent = group;

                    // Ojo Derecho
                    const eyeR = BABYLON.MeshBuilder.CreateCylinder("eyeR", {diameter: 0.55, height: 0.15}, scene);
                    eyeR.rotation.x = Math.PI/2;
                    eyeR.position = new BABYLON.Vector3(-0.4, 0.2, -0.72);
                    eyeR.material = matSilver; eyeR.parent = group;

                    // Interior oscuro ojo der
                    const pupilR = BABYLON.MeshBuilder.CreateCylinder("pupilR", {diameter: 0.4, height: 0.16}, scene);
                    pupilR.rotation.x = Math.PI/2;
                    pupilR.position = new BABYLON.Vector3(-0.4, 0.2, -0.72);
                    pupilR.material = matDark; pupilR.parent = group;
                    break;

                case 'p9': // TAPA SUPERIOR
                    const lid = BABYLON.MeshBuilder.CreateBox("lid", {width: 2.8, height: 0.08, depth: 1.4}, scene);
                    lid.position = new BABYLON.Vector3(0, 0.9, 0);
                    lid.material = matRed; lid.parent = group;
                    break;
            }
            
            // Inhabilitar colisiones de click para no estorbar a la cámara
            group.getChildMeshes(false).forEach(m => m.isPickable = false);
            return group;
        }

        function checkCompletion() {
            const allInstalled = Object.values(instaladas).every(val => val === true);
            if (allInstalled && !completado) {
                completado = true;
                
                document.getElementById('banner-completado').style.display = 'block';
                camera.attachControl(canvas, true);
                startConfetti();
            }
        }

        // CONFETI DE CELEBRACIÓN (Canvas 2D Superpuesto)
        function startConfetti() {
            const ctx = document.getElementById('confettiCanvas').getContext('2d');
            const cCanvas = document.getElementById('confettiCanvas');
            let width = cCanvas.width = cCanvas.offsetWidth;
            let height = cCanvas.height = cCanvas.offsetHeight;

            window.addEventListener('resize', () => {
                width = cCanvas.width = cCanvas.offsetWidth;
                height = cCanvas.height = cCanvas.offsetHeight;
            });

            const particles = [];
            const colors = ['#00f2ff', '#E52020', '#DDDDDD', '#1030B0', '#ffffff'];

            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();

                    p.y += p.dy;
                    p.x += Math.sin(p.y / 50) + p.dx;
                    
                    if (p.y > height) {
                        p.y = -20;
                        p.x = Math.random() * width;
                    }
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener('resize', () => {
            engine.resize();
        });
    </script>
</body>
