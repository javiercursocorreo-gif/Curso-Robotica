<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episodio IV - A New Hope</title>
    
    <!-- Librerías de Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>
    <!-- Babylon.js Inspector para depuración -->
    <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>
    <!-- GitHub Pages / Classroom CDN Asset Resolver -->
    <script>
    (function() {
        if (window.location.hostname.includes("github.io")) {
            const rawBase = "https://raw.githubusercontent.com/javiercursocorreo-gif/Curso-Robotica/main/";
            function resolveUrl(url) {
                if (typeof url === "string" && url.includes("MODELOS/")) {
                    return rawBase + url.substring(url.indexOf("MODELOS/"));
                }
                return url;
            }
            if (typeof BABYLON !== "undefined") {
                if (BABYLON.SceneLoader) {
                    const wrap2nd = (fn) => function(a1, a2, a3, a4, a5, a6, a7, a8) {
                        if (typeof a2 === "string" && a2.includes("MODELOS/")) a2 = resolveUrl(a2);
                        return fn.call(this, a1, a2, a3, a4, a5, a6, a7, a8);
                    };
                    const wrap1st = (fn) => function(a1, a2, a3, a4, a5, a6, a7, a8) {
                        if (typeof a1 === "string" && a1.includes("MODELOS/")) a1 = resolveUrl(a1);
                        return fn.call(this, a1, a2, a3, a4, a5, a6, a7, a8);
                    };
                    if (BABYLON.SceneLoader.ImportMesh) BABYLON.SceneLoader.ImportMesh = wrap2nd(BABYLON.SceneLoader.ImportMesh);
                    if (BABYLON.SceneLoader.ImportMeshAsync) BABYLON.SceneLoader.ImportMeshAsync = wrap2nd(BABYLON.SceneLoader.ImportMeshAsync);
                    if (BABYLON.SceneLoader.Append) BABYLON.SceneLoader.Append = wrap1st(BABYLON.SceneLoader.Append);
                    if (BABYLON.SceneLoader.AppendAsync) BABYLON.SceneLoader.AppendAsync = wrap1st(BABYLON.SceneLoader.AppendAsync);
                    if (BABYLON.SceneLoader.Load) BABYLON.SceneLoader.Load = wrap1st(BABYLON.SceneLoader.Load);
                    if (BABYLON.SceneLoader.LoadAsync) BABYLON.SceneLoader.LoadAsync = wrap1st(BABYLON.SceneLoader.LoadAsync);
                }
                if (BABYLON.Texture) {
                    const OrigTexture = BABYLON.Texture;
                    BABYLON.Texture = function(url, scene, noMipmap, invertY, samplingMode, onLoad, onError, buffer, deleteBuffer, format, mimeType, loaderOptions) {
                        if (typeof url === "string" && url.includes("MODELOS/")) url = resolveUrl(url);
                        return new OrigTexture(url, scene, noMipmap, invertY, samplingMode, onLoad, onError, buffer, deleteBuffer, format, mimeType, loaderOptions);
                    };
                    BABYLON.Texture.prototype = OrigTexture.prototype;
                    Object.assign(BABYLON.Texture, OrigTexture);
                }
            }
        }
    })();
    </script>


    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: 'Arial', sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
        
        /* Interfaz de Usuario (UI) superpuesta al Canvas */
        #ui-title {
            position: absolute;
            top: 40px;
            left: 50px;
            color: #000; /* Interior hueco/negro */
            -webkit-text-stroke: 2px #ffe81f; /* Borde amarillo clásico */
            font-size: 45px;
            font-family: 'Arial Black', Impact, sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            /* Efecto 3D clásico: Inclinación hacia el fondo y sombra extruida */
            transform: perspective(400px) rotateX(20deg) rotateY(15deg);
            transform-origin: bottom left;
            text-shadow: 
                 1px 1px 0 #ffe81f,
                 2px 2px 0 #b3a215,
                 3px 3px 0 #b3a215,
                 4px 4px 0 #80740f,
                 5px 5px 0 #80740f;
            pointer-events: none;
            z-index: 10;
        }
        
        #ui-instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 10;
        }
        .key {
            display: inline-block;
            background: #333;
            border: 1px solid #666;
            border-radius: 3px;
            padding: 2px 6px;
            margin-right: 5px;
            color: #ffe81f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Título Principal -->
    <div id="ui-title">Batalla Espacial 3D</div>
    
    <!-- Controles -->
    <div id="ui-instructions">
        <div><span class="key">◀</span> Disparo Destructor (Rojo)</div>
        <div><span class="key">▶</span> Disparo X-Wing (Verde)</div>
        <div><span class="key">▲</span> <span class="key">▼</span> Maniobra Evasiva X-Wing</div>
    </div>

    <!-- Canvas para Babylon.js (El espacio y la nave) -->
    <canvas id="renderCanvas"></canvas>

    <script src="app.js?v=64"></script>
</body>
</html>
