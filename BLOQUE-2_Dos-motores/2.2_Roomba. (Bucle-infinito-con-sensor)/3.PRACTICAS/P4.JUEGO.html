<div id="header">
  <div>
    <h1>El Robot Roomba</h1>
    <div class="subtitle">Repaso · Bucle infinito y sensor de obstáculos</div>
  </div>
  <div id="score-display">⭐ 0 puntos</div>
</div>

<div id="progress-bar" style="display: none;">
  <button class="prog-btn active" onclick="goGame(0)">🎯 Trivial</button>
  <button class="prog-btn" onclick="goGame(1)">📦 Ordenar</button>
  <button class="prog-btn" onclick="goGame(2)">🔗 Emparejar</button>
  <button class="prog-btn" onclick="goGame(3)">🎯 Reto Final</button>
</div>

<div id="main">
  <!-- PORTADA -->
  <div id="pantalla-inicio" class="pantalla activa">
    <div class="portada-emojis">🧹🤖</div>
    <div class="portada-titulo">¿Cómo limpia un robot aspirador autónomo?</div>
    <div class="portada-desc">4 retos interactivos sobre bucles infinitos de limpieza, sensores de choque, anticaídas e infrarrojos.</div>
    <div class="badges-container">
      <div class="badge-card">🎯 Trivial</div>
      <div class="badge-card">📦 Ordenar</div>
      <div class="badge-card">🔗 Emparejar</div>
      <div class="badge-card">🎯 Reto Final</div>
    </div>
    <button class="btn-empezar" onclick="iniciar()">¡EMPEZAR!</button>
  </div>

  <div id="game-area" style="display: none; width: 100%; max-width: 800px;"></div>
</div>

<script>
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

let score = 0;
let currentGame = 0;
const completedGames = [false, false, false, false];

function updateScore(n) {
  score += n;
  document.getElementById('score-display').textContent = '⭐ ' + score + ' puntos';
}

function updateProgressBar() {
  document.querySelectorAll('.prog-btn').forEach((b, i) => {
    b.className = 'prog-btn';
    if (completedGames[i]) b.classList.add('done');
    if (i === currentGame) b.classList.add('active');
  });
}

function iniciar() {
  document.getElementById('pantalla-inicio').classList.remove('activa');
  document.getElementById('pantalla-inicio').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'flex';
  document.getElementById('game-area').style.display = 'block';
  score = 0;
  currentGame = 0;
  completedGames.fill(false);
  updateScore(0);
  updateProgressBar();
  game1();
}

function goGame(n) {
  currentGame = n;
  updateProgressBar();
  games[n]();
}

function nextGame() {
  completedGames[currentGame] = true;
  updateProgressBar();
  if (currentGame < 3) {
    currentGame++;
    updateProgressBar();
    games[currentGame]();
  } else {
    showFinal();
  }
}

// ─── JUEGO 1: TRIVIAL (5 Preguntas) ──────────────────────────────────────────
const trivia = [
  {
    q: "¿Cómo sabe el robot Roomba que tiene una pared enfrente sin llegar a chocar violentamente?",
    opts: [
      "Mide la distancia proyectando un haz de luz infrarroja invisible",
      "Calcula las dimensiones de la habitación usando señal GPS",
      "Lleva una cámara de vídeo que escanea y mapea la habitación",
      "Dispone de un sensor láser de radar militar de largo alcance"
    ],
    ok: 0,
    exp: "✅ El emisor de infrarrojos frontal proyecta un rayo que al rebotar contra los muebles le informa de la proximidad del objeto."
  },
  {
    q: "¿A qué denominamos 'bucle infinito' en el comportamiento del Roomba?",
    opts: [
      "A una secuencia lógica de pasos (avanzar-detectar-girar) que se repite constantemente mientras limpia",
      "A la trayectoria exacta en círculos concéntricos que hace por la casa",
      "Al patrón de enredo que sufre el robot con los cables del suelo",
      "Al giro que da la correa del rodillo principal para aspirar el polvo"
    ],
    ok: 0,
    exp: "✅ Se trata de un bucle de control de software que se ejecuta indefinidamente hasta que el robot apaga sus motores o se queda sin energía."
  },
  {
    q: "¿Qué decisión adopta la centralita cuando el sensor de carga detecta que la batería baja del 15%?",
    opts: [
      "Interrumpe el bucle de limpieza, busca la señal de la base de carga y se acopla sola",
      "Se apaga inmediatamente en el lugar exacto donde se encuentre",
      "Reduce la velocidad de los motores a la mitad y continúa aspirando",
      "Sigue funcionando a máxima potencia hasta agotar por completo su carga a 0%"
    ],
    ok: 0,
    exp: "✅ El robot detiene la limpieza activa y pasa a modo navegación, buscando los haces infrarrojos guía que proyecta la base."
  },
  {
    q: "¿Qué función tiene el sensor anticaída (de suelo) ubicado en la base inferior del robot?",
    opts: [
      "Detectar desniveles bruscos (escalones o vacíos) para frenar y evitar caer al vacío",
      "Medir el tipo de material del suelo (parqué, baldosas o alfombras)",
      "Determinar la cantidad de polvo y pelusas acumuladas en el suelo",
      "Calcular la velocidad de avance midiendo la fricción de la rueda"
    ],
    ok: 0,
    exp: "✅ El sensor proyecta infrarrojos hacia el suelo; si el haz no rebota (porque hay un escalón), el robot frena de inmediato."
  },
  {
    q: "¿Qué sistema de movimiento utiliza el Roomba para avanzar y pivotar por la habitación?",
    opts: [
      "Tracción diferencial con dos motores independientes en sus ruedas principales",
      "Un motor principal acoplado a un eje de dirección delantero servo-controlado",
      "Tracción a las cuatro ruedas impulsada por un solo motor de engranaje",
      "Un mecanismo de vibración magnética excéntrica que lo desplaza sin ruedas"
    ],
    ok: 0,
    exp: "✅ Utiliza dos motores motrices de velocidad variable, exactamente igual que la silla eléctrica."
  }
];

let triviaIdx = 0;
let triviaAnswered = false;
let triviaAttempts = 0;

function game1() {
  triviaIdx = 0;
  renderTrivia();
}

function renderTrivia() {
  if (triviaIdx >= trivia.length) { nextGame(); return; }
  const q = trivia[triviaIdx];
  triviaAnswered = false;
  triviaAttempts = 0;
  
  const shuffled = shuffleArray([0, 1, 2, 3]);
  const correctShuffled = shuffled.indexOf(q.ok);

  const html = `
    <div class="game-card">
      <div class="game-title">🎯 Trivial · Pregunta ${triviaIdx+1} de ${trivia.length}</div>
      <div class="game-question">${q.q}</div>

function initDragSort() {
  const list = document.getElementById('sort-list');
  let draggingItem = null;

  list.querySelectorAll('.sort-item').forEach(item => {
    item.addEventListener('dragstart', () => {
      draggingItem = item;
      item.classList.add('dragging');
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      draggingItem = null;
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      item.classList.add('over');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('over');
    });

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('over');
      if (draggingItem && draggingItem !== item) {
        const children = Array.from(list.children);
        const fromIdx = children.indexOf(draggingItem);
        const toIdx = children.indexOf(item);
        
        // Swap items in memory array
        const temp = sortCurrentOrder[fromIdx];
        sortCurrentOrder[fromIdx] = sortCurrentOrder[toIdx];
        sortCurrentOrder[toIdx] = temp;
        
        renderSort();
      }
    });
  });
}

function checkSort() {
  if (sortDone) return;
  const current = [...document.querySelectorAll('.sort-item')].map(el => el.dataset.id);
  const fb = document.getElementById('fb-sort');
  if (JSON.stringify(current) === JSON.stringify(sortCorrect)) {
    fb.className = 'feedback show ok';

    fb.className = 'feedback show ko';
    fb.textContent = '❌ Orden erróneo. Recuerda: Limpiar recto → Detectar → Detenerse → Calcular desvío → Girar → Limpiar recto.';
    document.getElementById('btn-sol2').classList.add('show');
  }
}

function disableDrag() {
  document.querySelectorAll('.sort-item').forEach(el => {

    el.style.cursor = 'default';
  });
}

function showSortSolution() {

function selectMatch(el) {
  if (el.classList.contains('matched') || el.classList.contains('match-ok')) return;
  const side = el.dataset.side;
  if (!matchSelected) {
    if (side !== 'left') return;
    matchSelected = el;
    el.classList.add('selected');
  } else {
    if (side !== 'right') {
      matchSelected.classList.remove('selected');
      el.classList.add('selected');
      matchSelected = el;
      return;
    }
    const idxA = parseInt(matchSelected.dataset.idx);
    const idxB = parseInt(el.dataset.idx);
    if (idxA === idxB) {
      matchSelected.classList.remove('selected');
      matchSelected.classList.add('matched', 'match-ok');
      el.classList.add('matched', 'match-ok');
      matchDone++;
      if (matchDone === matchPairs.length) {
        const ownMatches = matchPairs.length - matchAutoCount;
        updateScore(ownMatches * 6);
        const fb = document.getElementById('fb-match');
        fb.className = 'feedback show ok';
        fb.textContent = '✅ ¡Correcto! Sabes para qué sirve cada componente del robot.';
        document.getElementById('btn-sol3').classList.remove('show');
        document.getElementById('btn-sig3').classList.add('show');
      }
    } else {
      matchSelected.classList.remove('selected');
      matchSelected.classList.add('match-ko');
      el.classList.add('match-ko');
      const prev = matchSelected;
      setTimeout(() => { prev.classList.remove('match-ko'); el.classList.remove('match-ko'); }, 600);
      document.getElementById('btn-sol3').classList.add('show');
    }
    matchSelected = null;
  }
}

function showMatchSolution() {
  const lefts = document.querySelectorAll('#left-col .match-item');
  const rights = document.querySelectorAll('#right-col .match-item');
  
  lefts.forEach(l => {
    if (!l.classList.contains('matched')) l.classList.add('matched', 'match-ok');
  });
  rights.forEach(r => {
    if (!r.classList.contains('matched')) r.classList.add('matched', 'match-ok');
  });
  
  matchAutoCount = matchPairs.length - matchDone;
  matchDone = matchPairs.length;
  
  const fb = document.getElementById('fb-match');
  fb.className = 'feedback show ok';
  fb.textContent = '💡 Solución: Aquí tienes todas las uniones correctas.';
  document.getElementById('btn-sol3').classList.remove('show');
  document.getElementById('btn-sig3').classList.add('show');
}

function drawRoomCanvas(s) {
  const canvas = document.getElementById('room-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Clear and background
  ctx.fillStyle = '#17172f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw floor grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 25) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 25) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  
  // Draw Obstacle/Wall
  if (s.isObstacle) {
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(100, 20, 100, 15);
    ctx.strokeStyle = '#ff8888';
    ctx.lineWidth = 1;
    ctx.strokeRect(100, 20, 100, 15);
    
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PARED / MUEBLE', 150, 11);
  }
  
  // Draw Cliff/Staircase
  if (s.isCliff) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 160, 300, 40);
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 160); ctx.lineTo(300, 160); ctx.stroke();
    
    ctx.fillStyle = '#ffcc00';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🕳️ VACÍO / ESCALÓN 🕳️', 150, 185);
  }
  
  // Draw Charging Base
  if (s.isBase) {
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(135, 10, 30, 15);
    
    // Draw IR beam guide cones from base
    ctx.fillStyle = 'rgba(0, 255, 136, 0.1)';
    ctx.beginPath();
    ctx.moveTo(150, 25);
    ctx.lineTo(80, 200);
    ctx.lineTo(220, 200);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BASE', 150, 8);
  }
  
  // Draw Roomba
  const rx = 150;
  const ry = s.roombaY;
  const radius = 22;
  
  ctx.beginPath();
  ctx.arc(rx, ry, radius, 0, Math.PI * 2);
  ctx.fillStyle = '#888899';
  ctx.fill();
  ctx.strokeStyle = '#aaaaaa';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Front bumper arc (highlighted)
  ctx.beginPath();
  ctx.arc(rx, ry, radius, Math.PI, 0);
  ctx.strokeStyle = '#444455';
  ctx.lineWidth = 4;
  ctx.stroke();
  
  // Roomba inner circle decoration
  ctx.beginPath();
  ctx.arc(rx, ry, radius - 6, 0, Math.PI * 2);
  ctx.fillStyle = '#222233';
  ctx.fill();
  
  // Direction indicator triangle
  ctx.beginPath();
  ctx.moveTo(rx, ry - 14);
  ctx.lineTo(rx - 5, ry - 5);
  ctx.lineTo(rx + 5, ry - 5);
  ctx.closePath();
  ctx.fillStyle = '#00f2ff';
  ctx.fill();
  
  // Battery icon on chassis
  if (parseInt(s.bat) <= 15) {
    ctx.font = '10px sans-serif';
    ctx.fillText('⚡', rx, ry + 6);
  } else {
    ctx.font = '10px sans-serif';
    ctx.fillText('🤖', rx, ry + 6);
  }
  
  // Draw sensor ray projection line
  if (s.sensorRay) {
    ctx.strokeStyle = s.isObstacle ? '#ff4444' : '#00ff88';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(rx, ry - radius);
    ctx.lineTo(rx, s.isObstacle ? 35 : 25);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}
