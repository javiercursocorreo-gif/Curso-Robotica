<!-- MEJORAS:
- Rediseño Estético Fiel a las Capturas: Brazo robótico de plástico naranja inyectado, base de madera cuadrada, motor de hombro negro y extremos de articulaciones en holograma cian.
- Solución al Render Negro: Motor WebGL de forma síncrona.
- Integración de los diales del suelo y de hombro con geometrías y canvas optimizados.
- Dial del hombro totalmente sólido (amarillo y negro) y corrección de Z-fighting.
- Dial del suelo actualizado con versión 3D exacta para alinear 90° y 270° correctamente.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>P1.CONSTRUCCION</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #10101a;
            font-family: 'Segoe UI', sans-serif;
            color: #ffffff;
        }

        /* HEADER */
        header {
            height: 70px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid #00f2ff;
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
            position: relative;
            box-sizing: border-box;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: #00f2ff;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        header p {
            margin: 0 0 0 20px;
            font-size: 18px;
            color: #aaaaaa;
        }

        /* LAYOUT PRINCIPAL - FLEXBOX */
        #main-layout {
            display: flex;
            height: calc(100vh - 70px);
            width: 100%;
        }

        /* CONTENEDOR DEL CANVAS */
        #canvas-container {
            flex: 1;
            height: 100%;
            position: relative;
            transition: box-shadow 0.3s ease;
            min-width: 0;
        }

        #canvas-container.drop-hover {
            box-shadow: inset 0 0 50px rgba(0, 242, 255, 0.5);
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* CONFETI Y BANNER FINAL */
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        #banner-completado {
            display: none;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 24, 30, 0.90);
            border: 2px solid #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
            color: #00f2ff;
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            z-index: 60;
        }

        #banner-completado h2 {
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #banner-completado p {
            margin: 10px 0 0 0;
            font-size: 20px;
            color: #ffffff;
        }

        /* PANEL LATERAL DE PIEZAS */
        #ui-panel {
            width: 400px;
            flex-shrink: 0;
            background: rgba(10, 10, 20, 0.95);
            border-left: 2px solid #00f2ff;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            box-sizing: border-box;
        }

        .panel-title {
            font-size: 22px;
            color: #00f2ff;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .piece-btn {
            background: #202030;
            border: 2px dashed #555;
            border-radius: 8px;
            color: #fff;
            min-height: 65px; 
            padding: 8px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: grab;
            transition: all 0.2s;
            text-align: left;
            box-sizing: border-box;
        }

        .piece-btn:hover {
            border-color: #00f2ff;
            background: #2a2a45;
        }

        .piece-btn:active {
            cursor: grabbing;
        }

        .piece-btn.installed {
            background: #11111a;
            border-color: #00ffaa;
            border-style: solid;
            color: #777;
            cursor: default;
        }

        .piece-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .piece-desc {
            font-size: 15px;
            color: #aaa;
        }

        .installed .piece-title {
            color: #00ffaa;
            opacity: 0.6;
        }
        .installed .piece-desc {
            color: #777;
        }
    </style>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <header>
        <h1>P1.CONSTRUCCION</h1>
        <p>Arrastra las piezas del hombro para conectar el primer tramo móvil del brazo robótico.</p>
    </header>

    <div id="main-layout">
        <div id="canvas-container">
            <canvas id="renderCanvas"></canvas>
            <canvas id="confettiCanvas"></canvas>
            <div id="banner-completado">
                <h2>¡HOMBRO COMPLETADO!</h2>
                <p>El hombro se ha ensamblado y realiza su primer movimiento coordinado.</p>
            </div>
        </div>

        <div id="ui-panel">
            <div class="panel-title">Articulación del Hombro (Arrastrar)</div>
            
            <button class="piece-btn" id="btn-barra_izq" draggable="true" title="Barra cilíndrica de soporte izquierda del hombro.">
                <div class="piece-title">Barra de soporte izq.</div>
                <div class="piece-desc">Tubo cilíndrico naranja izquierdo</div>
            </button>
            <button class="piece-btn" id="btn-barra_der" draggable="true" title="Barra cilíndrica de soporte derecha del hombro.">
                <div class="piece-title">Barra de soporte der.</div>
                <div class="piece-desc">Tubo cilíndrico naranja derecho</div>
            </button>
            <button class="piece-btn" id="btn-refuerzo_inf" draggable="true" title="Pasador cilíndrico transversal inferior para rigidizar las barras del hombro.">
                <div class="piece-title">Refuerzo inferior</div>
                <div class="piece-desc">Pasador transversal naranja inferior</div>
            </button>
            <button class="piece-btn" id="btn-refuerzo_sup" draggable="true" title="Pasador cilíndrico transversal superior para rigidizar las barras del hombro.">
                <div class="piece-title">Refuerzo superior</div>
                <div class="piece-desc">Pasador transversal naranja superior</div>
            </button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN BABYLON.JS
        const canvas = document.getElementById('renderCanvas');
        let engine;
        let scene;
        let camera;
        let shadowGen;
        let glow; // Variable global indispensable para los diales
        
        let baseRotator; // Nodo giratorio de la base (sólido)
        let shoulderNode; // Articulación del hombro (montaje por el alumno)
        
        let angle = -Math.PI / 3;
        let completado = false;
        
        // Materiales Estándar Robustos
        let orangeMat, blackMat, whiteMat, metalMat, woodMat, holoMat, lightOrangeMat, markerMat;

        // INICIALIZACIÓN SÍNCRONA DE MOTOR (Anti-Pantalla Negra)
        function initEngine() {
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            createScene();
            window.scene = scene;
            engine.runRenderLoop(() => {
                try { if(scene) scene.render(); } catch(err) { console.error(err); }
            });
            window.addEventListener('resize', () => engine.resize());
        }

        function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.10, 0.10, 0.18, 1);

            // Niebla Exponencial Obligatoria
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.035;
            scene.fogColor = new BABYLON.Color3(0.10, 0.10, 0.18);

            // Cámara
            camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/4, 14, new BABYLON.Vector3(0, 1.2, 0), scene);
            camera.lowerRadiusLimit = 5;
            camera.upperRadiusLimit = 20;

            // Luces Directas Fuertes
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
            hemi.intensity = 0.8;
            hemi.groundColor = new BABYLON.Color3(0.15, 0.15, 0.2);

            const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1,-2.5,-0.6), scene);
            dirLight.position = new BABYLON.Vector3(15,35,15);
            dirLight.intensity = 2.0;

            // Sombras
            shadowGen = new BABYLON.ShadowGenerator(2048, dirLight);
            shadowGen.useBlurExponentialShadowMap = true;
            shadowGen.blurKernel = 32;

            // Glow para Hologramas y Neones
            glow = new BABYLON.GlowLayer("glow", scene);
            glow.intensity = 0.75;

            // Suelo (Mesa de trabajo oscura)
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:40, height:40}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.18);
            groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            ground.material = groundMat;
            ground.receiveShadows = true;
            glow.addExcludedMesh(ground);

            // DIAL DEL SUELO
            createFloorDial(glow);

            // DEFINICIÓN DE MATERIALES ESTÁNDAR
            orangeMat = new BABYLON.StandardMaterial("orangeMat", scene);
            orangeMat.diffuseColor = BABYLON.Color3.FromHexString("#ff5500");
            orangeMat.specularColor = new BABYLON.Color3(0.4, 0.4, 0.4);
            orangeMat.specularPower = 32;

            lightOrangeMat = new BABYLON.StandardMaterial("lightOrangeMat", scene);
            lightOrangeMat.diffuseColor = BABYLON.Color3.FromHexString("#ffaa44");
            lightOrangeMat.specularColor = new BABYLON.Color3(0.4, 0.4, 0.4);
            lightOrangeMat.specularPower = 32;

            blackMat = new BABYLON.StandardMaterial("blackMat", scene);
            blackMat.diffuseColor = BABYLON.Color3.FromHexString("#1b1b1b");
            blackMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            blackMat.specularPower = 8;

            whiteMat = new BABYLON.StandardMaterial("whiteMat", scene);
            whiteMat.diffuseColor = BABYLON.Color3.FromHexString("#f5f5dc");
            whiteMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);

            metalMat = new BABYLON.StandardMaterial("metalMat", scene);
            metalMat.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);
            metalMat.specularColor = new BABYLON.Color3(0.9, 0.9, 0.9);
            metalMat.specularPower = 64;

            woodMat = new BABYLON.StandardMaterial("woodMat", scene);
            woodMat.diffuseColor = BABYLON.Color3.FromHexString("#c19a6b");
            woodMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            holoMat = new BABYLON.StandardMaterial("holoMat", scene);
            holoMat.diffuseColor = new BABYLON.Color3(0, 0.8, 1);
            holoMat.emissiveColor = new BABYLON.Color3(0, 0.6, 1);
            holoMat.alpha = 0.25;

            markerMat = new BABYLON.StandardMaterial("markerMat", scene);
            markerMat.diffuseColor = BABYLON.Color3.FromHexString("#ff3333");
            markerMat.emissiveColor = new BABYLON.Color3(0.8, 0, 0);

            // 1. BASE DE MADERA FIJA REDIMENSIONADA
            const basePlate = BABYLON.MeshBuilder.CreateBox("basePlate", {width: 2.4, height: 0.05, depth: 2.4}, scene);
            basePlate.position.y = 0.025;
            basePlate.rotation.y = Math.PI / 4;
            basePlate.material = woodMat;
            basePlate.receiveShadows = true;

            const gradCircle = BABYLON.MeshBuilder.CreateTorus("gradCircle", {diameter: 3.8, thickness: 0.03, tessellation: 64}, scene);
            gradCircle.position.y = 0.051;
            const gradMat = new BABYLON.StandardMaterial("gradMat", scene);
            gradMat.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
            gradCircle.material = gradMat;

            // 2. NODO ROTATORIO DE LA BASE
            baseRotator = new BABYLON.TransformNode("baseRotator", scene);

            // 3. PIEZAS SÓLIDAS DE LA BASE (Construidas por defecto)
            const domeBase = BABYLON.MeshBuilder.CreateCylinder("domeBase", {diameter: 3.0, height: 0.3, tessellation: 32}, scene);
            domeBase.position.y = 0.2;
            domeBase.material = orangeMat; domeBase.parent = baseRotator;
            shadowGen.addShadowCaster(domeBase);

            const domeSphere = BABYLON.MeshBuilder.CreateSphere("domeSphere", {diameter: 2.6}, scene);
            domeSphere.position.y = 0.35;
            domeSphere.scaling.y = 0.5;
            domeSphere.material = orangeMat; domeSphere.parent = baseRotator;
            shadowGen.addShadowCaster(domeSphere);

            const pillarL = BABYLON.MeshBuilder.CreateBox("pillarL", {width: 0.35, height: 1.3, depth: 0.6}, scene);
            pillarL.position.set(0.5, 1.0, 0);
            pillarL.material = orangeMat; pillarL.parent = baseRotator;
            shadowGen.addShadowCaster(pillarL);

            const pillarR = BABYLON.MeshBuilder.CreateBox("pillarR", {width: 0.35, height: 1.3, depth: 0.6}, scene);
            pillarR.position.set(-0.5, 1.0, 0);
            pillarR.material = orangeMat; pillarR.parent = baseRotator;
            shadowGen.addShadowCaster(pillarR);

            // 4. ARTICULACIÓN DEL HOMBRO (Padre del primer tramo y del resto del brazo)
            shoulderNode = new BABYLON.TransformNode("shoulderNode", scene);
            shoulderNode.parent = baseRotator;
            shoulderNode.position.set(0, 1.2, 0);
            shoulderNode.rotation.x = -Math.PI / 4; // Ángulo de reposo

            // Punteros indicadores fijos a la base (para leer el ángulo del hombro en 12 en punto)
            const pointerL = BABYLON.MeshBuilder.CreateBox("pointerL", {width: 0.02, height: 0.08, depth: 0.03}, scene);
            pointerL.position.set(0.935, 1.88, 0);
            pointerL.material = markerMat;
            pointerL.parent = baseRotator;

            const pointerR = BABYLON.MeshBuilder.CreateBox("pointerR", {width: 0.02, height: 0.08, depth: 0.03}, scene);
            pointerR.position.set(-0.935, 1.88, 0);
            pointerR.material = markerMat;
            pointerR.parent = baseRotator;

            // 2. DISCOS/CILINDROS EN LA ARTICULACIÓN DEL HOMBRO (SÓLIDOS)
            // Motor del hombro con la geometría de caja negra correcta
            const shoulderServo = BABYLON.MeshBuilder.CreateBox("shoulderServo", {width: 0.45, height: 0.45, depth: 0.65}, scene);
            shoulderServo.position.set(0.75, 0, 0);
            shoulderServo.material = blackMat; 
            shoulderServo.parent = shoulderNode;
            shadowGen.addShadowCaster(shoulderServo);

            // Diales del hombro
            createShoulderDial();

            const shoulderPin = BABYLON.MeshBuilder.CreateCylinder("shoulderPin", {diameter: 0.25, height: 1.25}, scene);
            shoulderPin.rotation.z = Math.PI / 2;
            shoulderPin.position.set(0, 1.2, 0);
            shoulderPin.material = metalMat; shoulderPin.parent = baseRotator;
            shadowGen.addShadowCaster(shoulderPin);

            const shoulderServoAxle = BABYLON.MeshBuilder.CreateCylinder("shoulderServoAxle", {diameter: 0.15, height: 0.3}, scene);
            shoulderServoAxle.rotation.z = Math.PI / 2;
            shoulderServoAxle.position.set(0.55, 1.2, 0);
            shoulderServoAxle.material = metalMat; shoulderServoAxle.parent = baseRotator;
            shadowGen.addShadowCaster(shoulderServoAxle);

            // Cables base
            for (let zOffset = -0.2; zOffset <= 0.2; zOffset += 0.2) {
                const wireMat = zOffset < -0.05 ? blackMat : (zOffset > 0.05 ? orangeMat : whiteMat);
                const wire = BABYLON.MeshBuilder.CreateCylinder("wire_" + zOffset, {diameter: 0.03, height: 1.2, tessellation: 8}, scene);
                wire.position.set(0.75, 0.5, zOffset - 0.35);
                wire.rotation.x = 0.5;
                wire.material = wireMat; wire.parent = baseRotator;
                shadowGen.addShadowCaster(wire);
            }

            // Piezas del hombro (Hologramas al inicio, se montan)
            const armBarL = BABYLON.MeshBuilder.CreateCylinder("armBarL", {diameter: 0.36, height: 1.8}, scene);
            armBarL.position.set(0.35, 0.8, 0);
            armBarL.material = holoMat; armBarL.parent = shoulderNode;
            armBarL.isPickable = false;

            const armBarR = BABYLON.MeshBuilder.CreateCylinder("armBarR", {diameter: 0.36, height: 1.8}, scene);
            armBarR.position.set(-0.35, 0.8, 0);
            armBarR.material = holoMat; armBarR.parent = shoulderNode;
            armBarR.isPickable = false;

            const armBrace1 = BABYLON.MeshBuilder.CreateCylinder("armBrace1", {diameter: 0.28, height: 0.5}, scene);
            armBrace1.rotation.z = Math.PI / 2;
            armBrace1.position.set(0, 0.2, 0);
            armBrace1.material = holoMat; armBrace1.parent = shoulderNode;
            armBrace1.isPickable = false;

            const armBrace2 = BABYLON.MeshBuilder.CreateCylinder("armBrace2", {diameter: 0.28, height: 0.5}, scene);
            armBrace2.rotation.z = Math.PI / 2;
            armBrace2.position.set(0, 1.4, 0);
            armBrace2.material = holoMat; armBrace2.parent = shoulderNode;
            armBrace2.isPickable = false;

            // 5. RESTO DEL BRAZO (Hologramas fijos sin interacción)
            const codoNode = new BABYLON.TransformNode("codoNode", scene);
            codoNode.parent = shoulderNode;
            codoNode.position.set(0, 1.7, 0);
            codoNode.rotation.x = Math.PI / 2;

            const codoPin = BABYLON.MeshBuilder.CreateCylinder("codoPin", {diameter: 0.3, height: 0.8}, scene);
            codoPin.rotation.z = Math.PI / 2;
            codoPin.material = holoMat; codoPin.parent = codoNode;
            codoPin.isPickable = false;

            const elbowServo = BABYLON.MeshBuilder.CreateBox("elbowServo", {width: 0.45, height: 0.45, depth: 0.65}, scene);
            elbowServo.position.set(0.4, 0, 0);
            elbowServo.material = holoMat; elbowServo.parent = codoNode;
            elbowServo.isPickable = false;

            const link2Node = new BABYLON.TransformNode("link2Node", scene);
            link2Node.parent = codoNode;

            const forearmBarL = BABYLON.MeshBuilder.CreateCylinder("forearmBarL", {diameter: 0.28, height: 1.3}, scene);
            forearmBarL.position.set(0.2, 0.6, 0);
            forearmBarL.material = holoMat; forearmBarL.parent = link2Node;
            forearmBarL.isPickable = false;

            const forearmBarR = BABYLON.MeshBuilder.CreateCylinder("forearmBarR", {diameter: 0.28, height: 1.3}, scene);
            forearmBarR.position.set(-0.2, 0.6, 0);
            forearmBarR.material = holoMat; forearmBarR.parent = link2Node;
            forearmBarR.isPickable = false;

            const forearmBrace = BABYLON.MeshBuilder.CreateCylinder("forearmBrace", {diameter: 0.22, height: 0.3}, scene);
            forearmBrace.rotation.z = Math.PI / 2;
            forearmBrace.position.set(0, 0.6, 0);
            forearmBrace.material = holoMat; forearmBrace.parent = link2Node;
            forearmBrace.isPickable = false;

            const munecaNode = new BABYLON.TransformNode("munecaNode", scene);
            munecaNode.parent = link2Node;
            munecaNode.position.set(0, 1.25, 0);
            munecaNode.rotation.x = Math.PI / 2;

            const wristServo = BABYLON.MeshBuilder.CreateBox("wristServo", {width: 0.4, height: 0.45, depth: 0.4}, scene);
            wristServo.position.set(0, 0.15, 0);
            wristServo.material = holoMat; wristServo.parent = munecaNode;
            wristServo.isPickable = false;

            const pinzaNode = new BABYLON.TransformNode("pinzaNode", scene);
            pinzaNode.parent = munecaNode;
            pinzaNode.position.set(0, 0.35, 0);
            pinzaNode.rotation.x = -Math.PI / 2;

            const gripperBase = BABYLON.MeshBuilder.CreateBox("gripperBase", {width: 0.5, height: 0.08, depth: 0.25}, scene);
            gripperBase.material = holoMat; gripperBase.parent = pinzaNode;
            gripperBase.isPickable = false;

            const gearG1 = BABYLON.MeshBuilder.CreateCylinder("gearG1", {diameter: 0.25, height: 0.06}, scene);
            gearG1.position.set(0.12, 0.05, 0);
            gearG1.material = holoMat; gearG1.parent = pinzaNode;
            gearG1.isPickable = false;

            const gearG2 = BABYLON.MeshBuilder.CreateCylinder("gearG2", {diameter: 0.25, height: 0.06}, scene);
            gearG2.position.set(-0.12, 0.05, 0);
            gearG2.material = holoMat; gearG2.parent = pinzaNode;
            gearG2.isPickable = false;

            const fingerL = BABYLON.MeshBuilder.CreateBox("fingerL", {width: 0.05, height: 0.07, depth: 0.35}, scene);
            fingerL.position.set(0.16, 0.05, 0.175);
            fingerL.rotation.y = 0.35;
            fingerL.material = holoMat; fingerL.parent = pinzaNode;
            fingerL.isPickable = false;

            const fingerL_dist = BABYLON.MeshBuilder.CreateBox("fingerL_dist", {width: 0.04, height: 0.07, depth: 0.25}, scene);
            fingerL_dist.position.set(0.11, 0.05, 0.4);
            fingerL_dist.rotation.y = -0.5;
            fingerL_dist.material = holoMat; fingerL_dist.parent = pinzaNode;
            fingerL_dist.isPickable = false;

            const tipL = BABYLON.MeshBuilder.CreateBox("tipL", {width: 0.02, height: 0.08, depth: 0.08}, scene);
            tipL.position.set(0.06, 0.05, 0.5);
            tipL.material = holoMat; tipL.parent = pinzaNode;
            tipL.isPickable = false;

            const fingerR = BABYLON.MeshBuilder.CreateBox("fingerR", {width: 0.05, height: 0.07, depth: 0.35}, scene);
            fingerR.position.set(-0.16, 0.05, 0.175);
            fingerR.rotation.y = -0.35;
            fingerR.material = holoMat; fingerR.parent = pinzaNode;
            fingerR.isPickable = false;

            const fingerR_dist = BABYLON.MeshBuilder.CreateBox("fingerR_dist", {width: 0.04, height: 0.07, depth: 0.25}, scene);
            fingerR_dist.position.set(-0.11, 0.05, 0.4);
            fingerR_dist.rotation.y = 0.5;
            fingerR_dist.material = holoMat; fingerR_dist.parent = pinzaNode;
            fingerR_dist.isPickable = false;

            const tipR = BABYLON.MeshBuilder.CreateBox("tipR", {width: 0.02, height: 0.08, depth: 0.08}, scene);
            tipR.position.set(-0.06, 0.05, 0.5);
            tipR.material = holoMat; tipR.parent = pinzaNode;
            tipR.isPickable = false;

            // Indicador Holográfico Inicial (Toro cian en la articulación del hombro)
            const indicator = BABYLON.MeshBuilder.CreateTorus("indicator", {diameter: 1.2, thickness: 0.04, tessellation: 32}, scene);
            indicator.position.set(0, 1.2, 0);
            const iMat = new BABYLON.StandardMaterial("iMat", scene);
            iMat.diffuseColor = new BABYLON.Color3(0, 0.8, 1);
            iMat.emissiveColor = new BABYLON.Color3(0, 0.6, 1);
            iMat.alpha = 0.5;
            indicator.material = iMat;

            // Bucle de renderizado
            scene.onBeforeRenderObservable.add(() => {
                if (!completado) {
                    angle += 0.004;
                    camera.alpha = angle;
                    if (indicator && !indicator.isDisposed()) {
                        indicator.rotation.y += 0.02;
                    }
                } else {
                    // Demo Coordinada Final
                    const time = performance.now() / 1000;
                    
                    // 1. Giro horizontal de base (Y): oscila armónicamente entre -45° y +45° (sentido antihorario positivo)
                    const baseAngle = Math.sin(time * 1.2) * 45;
                    baseRotator.rotation.y = - (baseAngle * Math.PI / 180);

                    // 2. Elevación vertical de hombro (X): oscila simultáneamente entre 15° y 75°
                    const shoulderAngle = 45 + Math.cos(time * 1.2) * 30;
                    shoulderNode.rotation.x = - (90 - shoulderAngle) * Math.PI / 180;
                }
            });
        }

        // CONTROL DE CONSTRUCCIÓN
        const instaladasReal = { barra_izq: false, barra_der: false, refuerzo_inf: false, refuerzo_sup: false };

        const canvasContainer = document.getElementById('canvas-container');
        document.querySelectorAll('.piece-btn').forEach(btn => {
            btn.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('pieza-id', btn.id.replace('btn-', ''));
            });
        });

        canvasContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            canvasContainer.classList.add('drop-hover');
        });

        canvasContainer.addEventListener('dragleave', () => {
            canvasContainer.classList.remove('drop-hover');
        });

        canvasContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            canvasContainer.classList.remove('drop-hover');
            const id = e.dataTransfer.getData('pieza-id');
            if (id) installPiece(id);
        });

        function installPiece(id) {
            if (instaladasReal[id]) return;
            instaladasReal[id] = true;

            // Eliminar indicador inicial
            const indicator = scene.getMeshByName("indicator");
            if (indicator && !indicator.isDisposed()) indicator.dispose();

            const btn = document.getElementById('btn-' + id);
            btn.classList.add('installed');
            btn.setAttribute('draggable', 'false');

            // Identificar la malla holográfica correspondiente
            let mesh;
            if (id === 'barra_izq') mesh = scene.getMeshByName("armBarL");
            if (id === 'barra_der') mesh = scene.getMeshByName("armBarR");
            if (id === 'refuerzo_inf') mesh = scene.getMeshByName("armBrace1");
            if (id === 'refuerzo_sup') mesh = scene.getMeshByName("armBrace2");

            if (mesh) {
                // Hacerla sólida cambiando el material
                mesh.material = orangeMat;
                shadowGen.addShadowCaster(mesh);

                // Animación pop-in suave
                mesh.scaling = new BABYLON.Vector3(0.01, 0.01, 0.01);
                let t0 = performance.now();
                const popAnim = () => {
                    const p = Math.min((performance.now() - t0) / 500, 1);
                    const s = 0.01 + 0.99 * p;
                    mesh.scaling = new BABYLON.Vector3(s, s, s);
                    if (p >= 1) {
                        mesh.scaling = new BABYLON.Vector3(1, 1, 1);
                        scene.onBeforeRenderObservable.removeCallback(popAnim);
                        checkCompletion();
                    }
                };
                scene.onBeforeRenderObservable.add(popAnim);
            }
        }

        function checkCompletion() {
            const allInstalled = Object.values(instaladasReal).every(val => val === true);
            if (allInstalled && !completado) {
                completado = true;
                
                document.getElementById('banner-completado').style.display = 'block';
                camera.alpha = -Math.PI / 2; // FIX CAMERA TO LOOK ALONG +Z
                camera.attachControl(canvas, true);
                startConfetti();
            }
        }

        // CONFETI
        function startConfetti() {
            const ctx = document.getElementById('confettiCanvas').getContext('2d');
            const cCanvas = document.getElementById('confettiCanvas');
            let width = cCanvas.width = cCanvas.offsetWidth;
            let height = cCanvas.height = cCanvas.offsetHeight;

            const particles = [];
            const colors = ['#00f2ff', '#FF5A09', '#EEEEEE', '#00ffaa', '#FFD166'];

            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();

                    p.y += p.dy;
                    p.x += Math.sin(p.y / 50) + p.dx;
                    
                    if (p.y > height) {
                        p.y = -20;
                        p.x = Math.random() * width;
                    }
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // 1. DIAL DEL SUELO INYECTADO (VERSIÓN 3D EXACTA INDICADA)
        function createFloorDial(glow) {
            const angles = [-90, -45, 0, 45, 90, 135, 180, 225, 270];
            angles.forEach(ang => {
                const rad = ang * Math.PI / 180;
                const dist = 2.15;
                const px = dist * Math.cos(rad);
                const pz = dist * Math.sin(rad);

                const tick = BABYLON.MeshBuilder.CreateBox("tick_" + ang, {width: 0.04, height: 0.02, depth: 0.15}, scene);
                tick.position.set(px * 0.92, 0.06, pz * 0.92);
                tick.rotation.y = -rad + Math.PI/2;
                
                const tickMat = new BABYLON.StandardMaterial("tickMat_" + ang, scene);
                tickMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
                tickMat.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                tick.material = tickMat;
                if (glow) glow.addIncludedOnlyMesh(tick);

                const label = BABYLON.MeshBuilder.CreatePlane("floorLabel_" + ang, {width: 0.8, height: 0.4}, scene);
                label.position.set(px, 0.055, pz);
                label.rotation.x = Math.PI / 2;
                label.rotation.y = -rad + Math.PI/2;

                const labelText = (ang < 0 ? ang + 360 : ang) + "°";
                const dynTex = new BABYLON.DynamicTexture("floorTex_" + ang, {width: 256, height: 128}, scene);
                dynTex.hasAlpha = true;
                const ctx = dynTex.getContext();
                ctx.fillStyle = "rgba(0,0,0,0)";
                ctx.fillRect(0, 0, 256, 128);
                
                ctx.font = "bold 72px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(labelText, 128, 64);
                dynTex.update();
                
                const mat = new BABYLON.StandardMaterial("floorMat_" + ang, scene);
                mat.diffuseTexture = dynTex;
                mat.useAlphaFromDiffuseTexture = true;
                mat.emissiveColor = new BABYLON.Color3(1, 1, 1);
                mat.disableLighting = true;
                label.material = mat;
            });
        }

        // 2. DIAL DEL HOMBRO CORREGIDO (Fondo amarillo 100% sólido)
        function createShoulderDial() {
            // SOLO DIAL IZQUIERDO (movido a X = 0.99 para evitar Z-fighting con la caja del motor que llega a 0.975)
            const dialL = BABYLON.MeshBuilder.CreateDisc("shoulderDialL", {radius: 0.64, tessellation: 64}, scene);
            dialL.parent = shoulderNode;
            dialL.position.set(0.99, 0, 0); 
            dialL.rotation.y = Math.PI / 2;

            const size = 512;
            const dynTexL = new BABYLON.DynamicTexture("shoulderDialTexL", {width: size, height: size}, scene);
            const ctxL = dynTexL.getContext();

            // FONDO AMARILLO SÓLIDO (Rellena todo el cuadrado, el disco lo recorta en círculo automáticamente)
            ctxL.fillStyle = "#ffcc00";
            ctxL.fillRect(0, 0, size, size);

            const cx = size / 2;
            const cy = size / 2;
            const r = size / 2;

            // Borde negro para contraste externo
            ctxL.strokeStyle = "#000000";
            ctxL.lineWidth = 12;
            ctxL.beginPath();
            ctxL.arc(cx, cy, r - 6, 0, 2 * Math.PI);
            ctxL.stroke();

            // Marcas principales
            const mainAngles = [0, 90, 180, 270];
            mainAngles.forEach(ang => {
                const rad = ang * Math.PI / 180;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);

                ctxL.strokeStyle = "#000000"; // Ticks negros
                ctxL.lineWidth = 8;
                ctxL.beginPath();
                ctxL.moveTo(cx + r * cos, cy + r * sin);
                ctxL.lineTo(cx + (r - 40) * cos, cy + (r - 40) * sin);
                ctxL.stroke();

                ctxL.save();
                ctxL.font = "bold 44px 'Segoe UI', Arial, sans-serif";
                ctxL.textAlign = "center";
                ctxL.textBaseline = "middle";
                ctxL.fillStyle = "#000000"; // Números negros
                ctxL.translate(cx + (r - 85) * cos, cy + (r - 85) * sin);
                ctxL.rotate(rad + Math.PI / 2);
                ctxL.fillText(ang + "°", 0, 0);
                ctxL.restore();
            });

            // Marcas secundarias
            const subAngles = [45, 135, 225, 315];
            subAngles.forEach(ang => {
                const rad = ang * Math.PI / 180;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);

                ctxL.strokeStyle = "#000000";
                ctxL.lineWidth = 4;
                ctxL.beginPath();
                ctxL.moveTo(cx + r * cos, cy + r * sin);
                ctxL.lineTo(cx + (r - 25) * cos, cy + (r - 25) * sin);
                ctxL.stroke();
            });
            dynTexL.update();

            const dialMatL = new BABYLON.StandardMaterial("shoulderDialMatL", scene);
            dialMatL.diffuseTexture = dynTexL;
            dialMatL.emissiveTexture = dynTexL;
            dialMatL.emissiveColor = new BABYLON.Color3(1, 1, 1);
            dialMatL.disableLighting = true; // Iluminación desactivada, color puro
            // IMPORTANTE: NO usamos useAlphaFromDiffuseTexture para garantizar opacidad total
            dialMatL.backFaceCulling = false;
            dialL.material = dialMatL;
            
            if(glow) glow.addExcludedMesh(dialL);
        }

        window.onload = () => {
            initEngine();
        }
    </script>
</body>
