<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Interactivo: Misión Apolo 11</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: radial-gradient(circle at center, #1a2a5c 0%, #0a142f 50%, #020514 100%); }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; background: transparent; }
        #loadingScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.5em; z-index: 100; transition: opacity 0.5s ease; pointer-events: none;}
        .spinner { border: 6px solid rgba(255, 255, 255, 0.1); border-top: 6px solid #ffcc88; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-top: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div id="loadingText">Iniciando Sistemas de la Misión...</div>
        <div class="spinner"></div>
    </div>
    <canvas id="renderCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        const phases = [
            {
                title: "FASE 1: EN LA PLATAFORMA",
                buttonText: "¡DESPEGUE DEL COHETE! 🚀",
                modelUrl: "../../../MODELOS/MODELOS NUEVOS 1/APOLLO_Y_CARRERA_ESPACIAL/n-1_5l_launch_site/",
                modelFile: "scene.gltf",
                desc1: "Torre de Lanzamiento",
                desc1text: "Estructura gigantesca que sujeta el cohete y le proporciona combustible y energía hasta el último segundo.",
                desc2: "Cuenta Atrás",
                desc2text: "Todos los sistemas de navegación y soporte vital se encienden mientras los astronautas esperan en la punta."
            },
            {
                title: "FASE 2: EL ASCENSO",
                buttonText: "SEPARACIÓN DE ETAPAS 🌍",
                modelUrl: "../../../MODELOS/MODELOS NUEVOS 1/APOLLO_Y_CARRERA_ESPACIAL/saturn_v_-_nasa/",
                modelFile: "scene.gltf",
                desc1: "Cohete Saturno V",
                desc1text: "El cohete más poderoso jamás construido, con 110 metros de altura y 3.000 toneladas de peso al despegue.",
                desc2: "Módulos de Propulsión",
                desc2text: "Tres fases gigantescas diseñadas para escapar de la gravedad terrestre e impulsar a la tripulación hacia la Luna."
            },
            {
                title: "FASE 3: EL VIAJE",
                buttonText: "VISTA DESDE LA CABINA 🧑‍🚀",
                modelUrl: "../../../MODELOS/MODELOS NUEVOS 1/APOLLO_Y_CARRERA_ESPACIAL/lunar_command_module/",
                modelFile: "scene.gltf",
                desc1: "Módulo de Mando y Servicio (CSM)",
                desc1text: "La nave principal que transportó a Neil, Buzz y Michael durante los 3 días de travesía por el vacío del espacio.",
                desc2: "Motor Principal (SPS)",
                desc2text: "Un motor crítico utilizado para realizar correcciones de rumbo, frenar y entrar en la órbita lunar."
            },
            {
                title: "FASE 4: VIDA EN EL ESPACIO",
                buttonText: "DESCENSO A LA LUNA 🌒",
                modelUrl: "../../../MODELOS/MODELOS NUEVOS 1/APOLLO_Y_CARRERA_ESPACIAL/apollo_command_module_interior_sphere_projection/",
                modelFile: "scene.gltf",
                desc1: "Interior del Cockpit",
                desc1text: "Un espacio presurizado minúsculo sin asientos reales, donde los 3 astronautas vivieron y trabajaron sin gravedad.",
                desc2: "Computador Apolo (AGC)",
                desc2text: "Navegaron hacia la Luna con una computadora analógica que tenía apenas 72 KB de memoria."
            },
            {
                title: "FASE 5: EL ÁGUILA HA ALUNIZADO",
                buttonText: "DESPLEGAR LUNAR ROVER 🚙",
                modelUrl: "../../../MODELOS/MODELOS NUEVOS 1/APOLLO_Y_CARRERA_ESPACIAL/apollo-11_lunar_module/",
                modelFile: "scene.gltf",
                desc1: "Módulo Lunar 'Eagle'",
                desc1text: "Nave de aspecto extraño (solo etapa de descenso y ascenso) diseñada exclusivamente para operar en el vacío lunar.",
                desc2: "Un Gran Salto",
                desc2text: "El 20 de Julio de 1969, dos seres humanos pisaron la superficie de otro mundo por primera vez en la historia."
            },
            {
                title: "FASE 6: EXPLORACIÓN",
                buttonText: "REGRESO A CASA 🌍",
                modelUrl: "../../../MODELOS/MODELOS NUEVOS 1/MOON/mondfahrzeug_lunar_rover/",
                modelFile: "scene.gltf",
                desc1: "Vehículo de Exploración Lunar",
                desc1text: "Un 'coche' eléctrico todoterreno, súper ligero y plegable que permitió a los astronautas explorar mucho más lejos.",
                desc2: "Ruedas de Malla de Alambre",
                desc2text: "Se inventaron para no hundirse en el polvo lunar y resistir temperaturas extremas sin neumáticos de goma."
            },
            {
                title: "FASE 7: EL REGRESO",
                buttonText: "REINICIAR MISIÓN 🔄",
                modelUrl: "../../../MODELOS/MODELOS NUEVOS 1/APOLLO_Y_CARRERA_ESPACIAL/ksp_bluedog_design_bureau_apollo_command_module/",
                modelFile: "scene.gltf",
                desc1: "Cápsula de Amerizaje",
                desc1text: "Es la única parte de toda la inmensa nave original que sobrevive y regresa intacta a la Tierra, cayendo al océano.",
                desc2: "Escudo Térmico",
                desc2text: "Protegió a los astronautas soportando una fricción infernal de hasta 2.700 °C durante la reentrada atmosférica."
            }
        ];

        let currentPhase = 0;
        let currentMeshes = [];
        let scene, camera, advancedTexture, uiPanel, nextButton;
        
        const createScene = async function () {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); 
            scene.createDefaultEnvironment({ createSkybox: false, createGround: false });

            const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.8;
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 1.0;

            camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 4, Math.PI / 3, 5, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;
            camera.useAutoRotationBehavior = true;

            // GUI setup
            advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
            
            // UI Panel Left
            uiPanel = new BABYLON.GUI.StackPanel();
            uiPanel.width = "400px";
            uiPanel.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
            uiPanel.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
            uiPanel.left = "20px";
            uiPanel.background = "rgba(10, 15, 20, 0.85)";
            uiPanel.isVertical = true;
            uiPanel.paddingTop = "20px";
            uiPanel.paddingBottom = "20px";
            advancedTexture.addControl(uiPanel);
            
            // Load Phase 0
            await loadPhase(currentPhase);
            return scene;
        };

        async function loadPhase(index) {
            // Show Loading
            const ls = document.getElementById("loadingScreen");
            ls.style.display = "flex";
            ls.style.opacity = "1";
            document.getElementById("loadingText").innerHTML = "Cargando Fase " + (index+1) + "...";
            
            // Clean UI
            uiPanel.clearControls();

            // Destroy previous meshes
            if (currentMeshes.length > 0) {
                currentMeshes.forEach(m => m.dispose());
                currentMeshes = [];
            }
            
            const phase = phases[index];
            
            // Load Model
            try {
                const result = await BABYLON.SceneLoader.ImportMeshAsync("", phase.modelUrl, phase.modelFile, scene);
                
                if (index === 2) {
                    // El modelo tiene una esfera gigante de estrellas que arruina la escala. La borramos.
                    result.meshes.forEach(m => {
                        if (m.name.toLowerCase().includes("sphere")) {
                            m.dispose();
                        }
                    });
                }
                
                const rootMesh = result.meshes[0];
                currentMeshes = result.meshes;
                
                // Scale and Center intelligently
                rootMesh.normalizeToUnitCube();
                let scaleFactor = 3;
                if (index === 0) scaleFactor = 6; // Fase 1 el doble de grande
                rootMesh.scaling.scaleInPlace(scaleFactor);
                
                let min = new BABYLON.Vector3(Number.MAX_VALUE, Number.MAX_VALUE, Number.MAX_VALUE);
                let max = new BABYLON.Vector3(-Number.MAX_VALUE, -Number.MAX_VALUE, -Number.MAX_VALUE);
                rootMesh.getChildMeshes().forEach(m => {
                    if (m.getTotalVertices() > 0) {
                        m.computeWorldMatrix(true);
                        const b = m.getBoundingInfo().boundingBox;
                        min = BABYLON.Vector3.Minimize(min, b.minimumWorld);
                        max = BABYLON.Vector3.Maximize(max, b.maximumWorld);
                    }
                });
                const center = BABYLON.Vector3.Center(min, max);
                rootMesh.position.subtractInPlace(center);
                
                if (index === 0) {
                    // Eliminado el desplazamiento de malla para no alterar el pivote. 
                    // Lo haremos moviendo la cámara.
                    rootMesh.position.y += 1.5; // Levanta la plataforma
                }
                
                if (index === 2 || index === 6) {
                    // Fix "crystal ball" effect: The models are too metallic/reflective
                    scene.materials.forEach(mat => {
                        if (mat.metallic !== undefined) {
                            mat.metallic = 0.7; // Aspecto metálico
                            mat.roughness = 0.4; // Metal cepillado (no espejo)
                            if (mat.albedoColor) {
                                mat.albedoColor = new BABYLON.Color3(0.6, 0.6, 0.65); // Tono gris aluminio
                            }
                        }
                    });
                }
                
                if (index === 5) {
                    // Oscurecer rover (fase 6)
                    scene.materials.forEach(mat => {
                        if (mat.albedoColor) {
                            mat.albedoColor = mat.albedoColor.scale(0.4);
                            mat.roughness = 0.9;
                            mat.metallic = 0.1;
                        }
                    });
                }

                // Build Phase UI
                const phaseTitle = new BABYLON.GUI.TextBlock();
                phaseTitle.text = phase.title;
                phaseTitle.height = "50px";
                phaseTitle.color = "#ffcc88";
                phaseTitle.fontSize = 24;
                phaseTitle.fontWeight = "bold";
                uiPanel.addControl(phaseTitle);

                const addFeature = function(title, description) {
                    const featureHeader = new BABYLON.GUI.TextBlock();
                    featureHeader.text = title.toUpperCase();
                    featureHeader.height = "35px";
                    featureHeader.color = "white";
                    featureHeader.fontSize = 18;
                    featureHeader.fontWeight = "bold";
                    featureHeader.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                    featureHeader.paddingLeft = "20px";
                    featureHeader.paddingTop = "10px";
                    uiPanel.addControl(featureHeader);

                    const featureText = new BABYLON.GUI.TextBlock();
                    featureText.text = description;
                    featureText.height = "100px";
                    featureText.color = "#bbccdd";
                    featureText.fontSize = 16;
                    featureText.textWrapping = true;
                    featureText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                    featureText.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
                    featureText.paddingLeft = "20px";
                    featureText.paddingRight = "20px";
                    uiPanel.addControl(featureText);
                };

                addFeature(phase.desc1, phase.desc1text);
                addFeature(phase.desc2, phase.desc2text);
                
                // Add Next Button
                nextButton = BABYLON.GUI.Button.CreateSimpleButton("nextBtn", phase.buttonText);
                nextButton.width = "300px";
                nextButton.height = "60px";
                nextButton.color = "white";
                nextButton.cornerRadius = 10;
                nextButton.background = "#d32f2f";
                nextButton.fontSize = 20;
                nextButton.fontWeight = "bold";
                nextButton.marginTop = "20px";
                
                nextButton.onPointerUpObservable.add(function() {
                    currentPhase++;
                    if (currentPhase >= phases.length) currentPhase = 0;
                    loadPhase(currentPhase);
                });
                uiPanel.addControl(nextButton);

                // Reset Camera
                camera.alpha = Math.PI / 4;
                camera.beta = Math.PI / 3;
                
                if (index === 0) {
                    camera.target = new BABYLON.Vector3(-1.5, 0, 0); // Desplaza el modelo a la derecha
                } else {
                    camera.target = BABYLON.Vector3.Zero();
                }
                
                // Revertimos la fase 4 a la cámara exterior para que el usuario pueda hacer zoom manualmente
                camera.radius = 5;
                camera.fov = 0.8;
                
                // Configurar velocidad de rotación de cámara
                if (camera.autoRotationBehavior) {
                    if (index === 1) {
                        camera.autoRotationBehavior.idleRotationSpeed = 0.133; // 1/3 más rápido (por defecto es 0.1)
                    } else {
                        camera.autoRotationBehavior.idleRotationSpeed = 0.1; // Velocidad normal
                    }
                }

                // Hide Loading
                ls.style.opacity = "0";
                setTimeout(() => ls.style.display = "none", 500);

            } catch(e) {
                document.getElementById("loadingText").innerHTML = "Error cargando la Fase " + (index+1) + ".";
                console.error(e);
            }
        }

        createScene().then(s => {
            engine.runRenderLoop(() => { s.render(); });
        });
        window.addEventListener("resize", () => { engine.resize(); });
    </script>
</body>
</html>
