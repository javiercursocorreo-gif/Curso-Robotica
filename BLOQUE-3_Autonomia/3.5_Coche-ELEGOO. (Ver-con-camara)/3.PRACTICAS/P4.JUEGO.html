<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P4.JUEGO — Coche Autónomo</title>
<style>
:root {
  --primary: #00f2ff;
  --bg: #0d0d1a;
  --bg2: #13132a;
  --glass: rgba(0,20,40,0.85);
  --text: #ffffff;
  --sub: #aaaaaa;
  --success: #00e676;
  --danger: #ff4444;
  --warning: #ffcc00;
  --orange: #FF6B35;
  --teal: #00BFA5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', Tahoma, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
#header {
  position: fixed; top: 0; left: 0; right: 0; height: 70px;
  background: rgba(0,0,0,0.9);
  border-bottom: 2px solid var(--primary);
  z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
}
#header h1 { font-size: 22px; color: var(--primary); letter-spacing: 5px; text-transform: uppercase; }
#header .subtitle { font-size: 14px; color: var(--sub); }
#score-display { font-size: 20px; color: var(--warning); font-weight: bold; }
#progress-bar {
  position: fixed; top: 70px; left: 0; right: 0;
  background: rgba(0,0,0,0.8);
  border-bottom: 1px solid #333;
  display: flex; z-index: 99; padding: 6px 12px; gap: 8px;
}
.prog-btn {
  flex: 1; height: 44px; border: 2px solid #444; background: transparent;
  color: var(--sub); font-size: 14px; cursor: pointer;
  border-radius: 8px; transition: all 0.3s;
  font-family: 'Segoe UI', sans-serif;
}
.prog-btn.active { border-color: var(--warning); color: var(--warning); background: rgba(255,204,0,0.1); }
.prog-btn.done { border-color: var(--primary); color: var(--primary); background: rgba(0,242,255,0.1); }
#main {
  margin-top: 130px;
  min-height: calc(100vh - 130px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.pantalla {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; max-width: 800px; width: 100%;
}
.pantalla.activa { display: flex; }
.portada-emojis { font-size: 80px; margin-bottom: 20px; }
.portada-titulo { font-size: 32px; font-weight: bold; color: var(--primary); margin-bottom: 12px; }
.portada-desc { font-size: 18px; color: var(--sub); margin-bottom: 30px; max-width: 520px; line-height: 1.6; }
.badges-container { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 36px; }
.badge-card { background: rgba(0,242,255,0.06); border: 2px solid var(--primary); border-radius: 12px; padding: 14px 22px; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }

.btn-empezar {
  background: var(--primary); color: #000; border: none; padding: 18px 48px;
  font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer;
  min-height: 70px; transition: all 0.2s; letter-spacing: 2px;
}
.btn-empezar:hover { background: #00d4e0; transform: scale(1.03); }

.game-card {
  background: var(--glass);
  border: 1px solid rgba(0,242,255,0.3);
  border-radius: 20px;
  padding: 36px;
  max-width: 800px;
  width: 100%;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(0,242,255,0.08);
}
.game-title { font-size: 13px; letter-spacing: 4px; color: var(--primary); text-transform: uppercase; margin-bottom: 10px; }
.game-question { font-size: 22px; line-height: 1.4; margin-bottom: 28px; color: var(--text); font-weight: 600; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.opt-btn {
  min-height: 75px; padding: 16px 20px;
  border: 2px solid #444; background: rgba(255,255,255,0.04);
  color: var(--text); font-size: 18px; cursor: pointer;
  border-radius: 12px; transition: all 0.25s;
  font-family: 'Segoe UI', sans-serif;
  text-align: left; line-height: 1.3;
}
.opt-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(0,242,255,0.08); }
.opt-btn.correct { border-color: var(--success); background: rgba(0,230,118,0.15); color: var(--success); }
.opt-btn.wrong { border-color: var(--danger); background: rgba(255,68,68,0.1); color: var(--danger); }
.opt-btn:disabled { cursor: default; }

.feedback {
  min-height: 60px; padding: 14px 20px;
  border-radius: 10px; font-size: 18px; margin-bottom: 18px;
  display: none; line-height: 1.4;
}
.feedback.show { display: block; }
.feedback.ok { background: rgba(0,230,118,0.15); border: 1px solid var(--success); color: var(--success); }
.feedback.ko { background: rgba(255,68,68,0.1); border: 1px solid var(--danger); color: var(--danger); }

.btn-siguiente {
  display: none; min-height: 75px; width: 100%;
  background: var(--primary); color: #000;
  border: none; border-radius: 12px;
  font-size: 20px; font-weight: bold; cursor: pointer;
  transition: all 0.2s; font-family: 'Segoe UI', sans-serif;
  letter-spacing: 2px; margin-bottom: 12px;
}
.btn-siguiente.show { display: block; }
.btn-siguiente:hover { background: #00d4e0; transform: translateY(-2px); }

.btn-solucion {
  display: none; min-height: 75px; width: 100%;
  background: var(--warning); color: #000;
  border: none; border-radius: 12px;
  font-size: 20px; font-weight: bold; cursor: pointer;
  transition: all 0.2s; font-family: 'Segoe UI', sans-serif;
  letter-spacing: 2px; margin-bottom: 12px;
}
.btn-solucion.show { display: block; }
.btn-solucion:hover { background: #e6b800; transform: translateY(-2px); }

.btn-reiniciar {
  min-height: 55px; padding: 0 24px;
  background: transparent; border: 2px solid #555; color: var(--sub);
  border-radius: 10px; font-size: 16px; cursor: pointer;
  font-family: 'Segoe UI', sans-serif; margin-top: 14px;
}
.btn-reiniciar:hover { border-color: var(--warning); color: var(--warning); }

/* Sortable items */
.sortable-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.sort-item {
  min-height: 70px; padding: 14px 20px;
  background: rgba(0,191,165,0.08); border: 2px solid var(--teal);
  border-radius: 12px; font-size: 18px; cursor: grab;
  display: flex; align-items: center; gap: 14px;
  user-select: none; transition: all 0.2s;
}
.sort-item:active { cursor: grabbing; }
.sort-item.dragging { opacity: 0.4; }
.sort-item.over { border: 2px dashed var(--warning) !important; background: rgba(255,204,0,0.08) !important; }
.sort-num {
  width: 36px; height: 36px; background: var(--teal);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 16px; color: #000; flex-shrink: 0;
}
.btn-verificar {
  min-height: 75px; width: 100%;
  background: var(--orange); color: #fff;
  border: none; border-radius: 12px;
  font-size: 20px; font-weight: bold; cursor: pointer;
  font-family: 'Segoe UI', sans-serif; margin-bottom: 12px;
}
.btn-verificar:hover { background: #e55c28; }

/* Match grid */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-item {
  min-height: 70px; padding: 14px 16px;
  border: 2px solid #444; border-radius: 10px;
  font-size: 17px; cursor: pointer; transition: all 0.25s;
  display: flex; align-items: center; line-height: 1.3;
}
.match-item.left { background: rgba(255,107,53,0.1); border-color: var(--orange); }
.match-item.right { background: rgba(0,191,165,0.1); border-color: var(--teal); }
.match-item.selected { transform: scale(1.03); box-shadow: 0 0 20px rgba(0,242,255,0.4); border-color: var(--primary); }
.match-item.matched { opacity: 0.5; cursor: default; border-style: dashed; }
.match-item.match-ok { border-color: var(--success); background: rgba(0,230,118,0.12); color: var(--success); }
.match-item.match-ko { border-color: var(--danger); background: rgba(255,68,68,0.1); animation: shake 0.4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* J4 Semáforo visual display */
.semaforo-wrap { display: flex; gap: 40px; align-items: center; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
.semaforo-box { background: #111; border: 3px solid #444; border-radius: 16px; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.hud-banner {
  background: rgba(255, 68, 68, 0.15); border: 2px solid #ff4444;
  color: #ff8888; border-radius: 8px; padding: 10px; font-weight: bold;
  text-align: center; margin-top: 10px; animation: pulseRed 1s infinite alternate;
  font-size: 15px; letter-spacing: 1px;
}
@keyframes pulseRed {
  from { box-shadow: 0 0 5px #ff4444; }
  to { box-shadow: 0 0 20px #ff4444; }
}
.luz { width: 52px; height: 52px; border-radius: 50%; background: #333; border: 2px solid #222; transition: all 0.4s; }
.luz.rojo.on { background: #ff2222; box-shadow: 0 0 20px #ff2222; }
.luz.amarillo.on { background: #ffcc00; box-shadow: 0 0 20px #ffcc00; }
.luz.verde.on { background: #00e676; box-shadow: 0 0 20px #00e676; }

#final-screen {
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px;
}
.trophy { font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite alternate; }
@keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-15px)} }
.final-title { font-size: 32px; color: var(--primary); letter-spacing: 4px; margin-bottom: 12px; }
.final-score { font-size: 22px; color: var(--warning); margin-bottom: 30px; }
.btn-replay {
  min-height: 75px; padding: 0 48px;
  background: var(--primary); color: #000;
  border: none; border-radius: 16px;
  font-size: 22px; font-weight: bold; cursor: pointer;
  font-family: 'Segoe UI', sans-serif; letter-spacing: 2px;
}
.btn-replay:hover { background: #00d4e0; }

@media (max-width: 768px) {
  #header { height: auto; padding: 10px; flex-direction: column; gap: 5px; align-items: flex-start; }
  #score-display { text-align: left !important; font-size: 18px; }
  #progress-bar { top: 105px; }
  #main { margin-top: 165px; min-height: calc(100vh - 165px); }
}
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Coche Autónomo</h1>
    <div class="subtitle">Repaso · Ver con cámara</div>
  </div>
  <div id="score-display">⭐ 0 puntos</div>
</div>

<div id="progress-bar" style="display: none;">
  <button class="prog-btn active" onclick="goGame(0)">🎯 Trivial</button>
  <button class="prog-btn" onclick="goGame(1)">📦 Ordenar</button>
  <button class="prog-btn" onclick="goGame(2)">🔗 Emparejar</button>
  <button class="prog-btn" onclick="goGame(3)">🎯 Reto Final</button>
</div>

<div id="main">
  <!-- PORTADA -->
  <div id="pantalla-inicio" class="pantalla activa">
    <div class="portada-emojis">🚗🚦</div>
    <div class="portada-titulo">¿Cómo ven los coches autónomos?</div>
    <div class="portada-desc">4 minijuegos para repasar la detección de señales, la toma de decisiones y la percepción visual.</div>
    <div class="badges-container">
      <div class="badge-card">🎯 Trivial</div>
      <div class="badge-card">📦 Ordenar</div>
      <div class="badge-card">🔗 Emparejar</div>
      <div class="badge-card">🎯 Reto Final</div>
    </div>
    <button class="btn-empezar" onclick="iniciar()">¡EMPEZAR!</button>
  </div>

  <div id="game-area" style="display: none; width: 100%; max-width: 800px;"></div>
</div>

<script>
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

let score = 0;
let currentGame = 0;
const completedGames = [false, false, false, false];

function updateScore(n) {
  score += n;
  document.getElementById('score-display').textContent = '⭐ ' + score + ' puntos';
}

function updateProgressBar() {
  document.querySelectorAll('.prog-btn').forEach((b, i) => {
    b.className = 'prog-btn';
    if (completedGames[i]) b.classList.add('done');
    if (i === currentGame) b.classList.add('active');
  });
}

function iniciar() {
  document.getElementById('pantalla-inicio').classList.remove('activa');
  document.getElementById('pantalla-inicio').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'flex';
  document.getElementById('game-area').style.display = 'block';
  score = 0;
  currentGame = 0;
  completedGames.fill(false);
  updateScore(0);
  updateProgressBar();
  game1();
}

function goGame(n) {
  currentGame = n;
  updateProgressBar();
  games[n]();
}

function nextGame() {
  completedGames[currentGame] = true;
  updateProgressBar();
  if (currentGame < 3) {
    currentGame++;
    updateProgressBar();
    games[currentGame]();
  } else {
    showFinal();
  }
}

// ─── JUEGO 1: TRIVIAL (5 Preguntas) ──────────────────────────────────────────
const trivia = [
  {
    q: "¿Por qué el coche de esta clase tiene la carrocería con formas redondeadas y curvas en lugar de cajas cuadradas?",
    opts: [
      "Porque las cajas cuadradas son imposibles de programar en 3D",
      "Porque las curvas son más aerodinámicas, realistas y permiten que los reflejos de luz se vean naturales",
      "Porque los coches cuadrados no pueden girar correctamente",
      "Porque las cajas pesaban mucho más y consumían demasiada energía"
    ],
    ok: 1,
    exp: "✅ ¡Correcto! Las superficies redondeadas imitan la aerodinámica real y permiten que los sombreados y reflejos de luz luzcan realistas en la simulación."
  },
  {
    q: "¿Por qué el coche frena antes de llegar al semáforo y no justo cuando pasa por debajo?",
    opts: [
      "Porque la cámara detecta el semáforo a distancia y necesita tiempo para decelerar suavemente",
      "Porque el semáforo envía una onda electromagnética que frena los motores",
      "Porque el conductor remoto le ordena parar",
      "Porque es una limitación física de las ruedas de goma"
    ],
    ok: 0,
    exp: "✅ ¡Correcto! La cámara captura la imagen a distancia, lo que da tiempo a que el programa de control envíe órdenes de frenado gradual y seguro, como haría un humano."
  },
  {
    q: "Si hay niebla muy densa en la carretera, ¿qué le ocurriría al sistema VER CON CÁMARA del coche?",
    opts: [
      "Seguiría funcionando igual, la niebla no bloquea las lentes",
      "Le costaría mucho más detectar objetos debido a que la imagen capturada estaría borrosa",
      "Mejoraría su precisión al haber menos reflejos de luz",
      "Cambiaría automáticamente a conducción manual remota"
    ],
    ok: 1,
    exp: "✅ ¡Exacto! Las cámaras dependen de la luz visible. Con niebla densa, la imagen se emborrona y la confianza de detección cae. Por eso los coches reales usan también sensores Lidar o Radar."
  },
  {
    q: "¿Qué ventaja tiene el coche robot sobre un conductor humano al observar un semáforo?",
    opts: [
      "El conductor humano siempre reacciona más rápido en emergencias",
      "El coche robot mantiene una atención del 100%: no se distrae, no se cansa ni mira el móvil",
      "El conductor humano distingue mejor los colores en total oscuridad",
      "No hay ninguna ventaja reseñable, sus reflejos son idénticos"
    ],
    ok: 1,
    exp: "✅ ¡Exacto! Los conductores humanos pueden distraerse. La cámara y el microprocesador están dedicados exclusivamente al análisis del entorno segundo a segundo."
  },
  {
    q: "¿Cuál es el sensor principal que permite al coche autónomo 'ver' la luz del semáforo e identificar su color?",
    opts: [
      "Un sensor óptico infrarrojo de corto alcance",
      "La cámara digital frontal junto al programa de reconocimiento de imagen",
      "Un receptor de radiofrecuencia de ondas cortas",
      "Un sensor de ultrasonidos situado en el parachoques"
    ],
    ok: 1,
    exp: "✅ ¡Perfecto! La cámara digital frontal captura la imagen y el algoritmo de reconocimiento visual detecta si hay un semáforo y analiza si su color es rojo, amarillo o verde."
  }
];

let triviaIdx = 0;
let triviaAnswered = false;
let triviaAttempts = 0;

function game1() {
  triviaIdx = 0;
  renderTrivia();
}

function renderTrivia() {
  if (triviaIdx >= trivia.length) { nextGame(); return; }
  const q = trivia[triviaIdx];
  triviaAnswered = false;
  triviaAttempts = 0;
  
  const shuffled = shuffleArray([0, 1, 2, 3]);
  const correctShuffled = shuffled.indexOf(q.ok);

  const html = `
    <div class="game-card">
      <div class="game-title">🎯 Trivial · Pregunta ${triviaIdx+1} de ${trivia.length}</div>
      <div class="game-question">${q.q}</div>
      <div class="options-grid">
        ${shuffled.map((i, pos) => `
          <button class="opt-btn" onclick="answerTrivia(this, ${pos}, ${correctShuffled})">${q.opts[i]}</button>
        `).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <button class="btn-solucion" id="btn-sol" onclick="showTriviaSolution(${correctShuffled})">VER SOLUCIÓN 💡</button>
      <button class="btn-siguiente" id="btn-sig" onclick="triviaNext()">SIGUIENTE →</button>
      <button class="btn-reiniciar" onclick="game1()">REINICIAR JUEGO</button>
    </div>`;
  document.getElementById('game-area').innerHTML = html;
}

function answerTrivia(btn, pos, correctPos) {
  if (triviaAnswered) return;
  const q = trivia[triviaIdx];
  const btns = document.querySelectorAll('.opt-btn');
  const fb = document.getElementById('fb');
  if (pos === correctPos) {
    triviaAnswered = true;
    btns.forEach(b => b.disabled = true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = q.exp;
    if (triviaAttempts === 0) {
      updateScore(20);
    } else {
      updateScore(10);
    }
    document.getElementById('btn-sol').classList.remove('show');
    document.getElementById('btn-sig').classList.add('show');
  } else {
    triviaAttempts++;
    btn.classList.add('wrong');
    btn.disabled = true;
    fb.className = 'feedback show ko';
    fb.textContent = '❌ No es esa. ¡Inténtalo de nuevo!';
    document.getElementById('btn-sol').classList.add('show');
  }
}

function showTriviaSolution(correctPos) {
  triviaAnswered = true;
  const q = trivia[triviaIdx];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => {
    b.disabled = true;
    b.classList.remove('wrong');
  });
  btns[correctPos].classList.add('correct');
  const fb = document.getElementById('fb');
  fb.className = 'feedback show ok';
  fb.textContent = '💡 Solución: ' + q.exp;
  document.getElementById('btn-sol').classList.remove('show');
  document.getElementById('btn-sig').classList.add('show');
}

function triviaNext() { triviaIdx++; renderTrivia(); }

// ─── JUEGO 2: ORDENAR (6 pasos Drag & Drop nativo) ────────────────────────────
const sortItems = [
  { id: 'a', text: '📷 La cámara frontal captura una imagen de lo que tiene delante' },
  { id: 'b', text: '🔍 El programa analiza la imagen buscando objetos conocidos' },
  { id: 'c', text: '🚦 Detecta: "Es un semáforo en rojo"' },
  { id: 'd', text: '🧠 Decide: "Debo frenar"' },
  { id: 'e', text: '🛑 Ejecuta la acción: frena suavemente hasta parar' },
  { id: 'f', text: '👁️ Sigue mirando: espera a que el semáforo cambie a verde' }
];
const sortCorrect = ['a', 'b', 'c', 'd', 'e', 'f'];
let sortCurrentOrder = [];
let sortDone = false;
let sortAttempts = 0;

function game2() {
  sortCurrentOrder = shuffleArray([...sortItems]);
  sortDone = false;
  sortAttempts = 0;
  renderSort();
}

function renderSort() {
  const html = `
    <div class="game-card">
      <div class="game-title">📦 Ordenar · Flujo de Visión Artificial</div>
      <div class="game-question">Arrastra los pasos para ordenar las fases lógicas del coche desde que capta la luz hasta que actúa.</div>
      <div class="sortable-list" id="sort-list">
        ${sortCurrentOrder.map((item, i) => `
          <div class="sort-item" draggable="true" data-id="${item.id}">
            <div class="sort-num">${i+1}</div>
            <span>${item.text}</span>
          </div>
        `).join('')}
      </div>
      <button class="btn-verificar" onclick="checkSort()">VERIFICAR ORDEN</button>
      <div class="feedback" id="fb-sort"></div>
      <button class="btn-solucion" id="btn-sol2" onclick="showSortSolution()">VER SOLUCIÓN 💡</button>
      <button class="btn-siguiente" id="btn-sig2" onclick="nextGame()">SIGUIENTE JUEGO →</button>
      <button class="btn-reiniciar" onclick="game2()">REINICIAR JUEGO</button>
    </div>`;
  document.getElementById('game-area').innerHTML = html;
  initDragSort();
}

function initDragSort() {
  const list = document.getElementById('sort-list');
  let dragEl = null;
  list.querySelectorAll('.sort-item').forEach(item => {
    item.addEventListener('dragstart', () => { dragEl = item; item.classList.add('dragging'); });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); dragEl = null; renumberSort(); });
    item.addEventListener('dragover', e => { e.preventDefault(); if (dragEl && dragEl !== item) item.classList.add('over'); });
    item.addEventListener('dragleave', () => item.classList.remove('over'));
    item.addEventListener('drop', e => {
      e.preventDefault(); item.classList.remove('over');
      if (dragEl && dragEl !== item) {
        const items = [...list.querySelectorAll('.sort-item')];
        const fromIdx = items.indexOf(dragEl);
        const toIdx = items.indexOf(item);
        if (fromIdx < toIdx) list.insertBefore(dragEl, item.nextSibling);
        else list.insertBefore(dragEl, item);
      }
    });
  });
}

function renumberSort() {
  document.querySelectorAll('.sort-item').forEach((el, i) => {
    el.querySelector('.sort-num').textContent = i + 1;
  });
}

function disableDrag() {
  document.querySelectorAll('.sort-item').forEach(el => {
    el.removeAttribute('draggable');
    el.style.cursor = 'default';
  });
}

function checkSort() {
  if (sortDone) return;
  const current = [...document.querySelectorAll('.sort-item')].map(el => el.dataset.id);
  const fb = document.getElementById('fb-sort');
  if (JSON.stringify(current) === JSON.stringify(sortCorrect)) {
    fb.className = 'feedback show ok';
    fb.textContent = '✅ ¡Excelente! La percepción (cámara) precede a la clasificación (reconocimiento), luego se toma la decisión y se envía la señal de frenado al motor.';
    if (sortAttempts === 0) {
      updateScore(30);
    }
    sortDone = true;
    disableDrag();
    document.getElementById('btn-sol2').classList.remove('show');
    document.getElementById('btn-sig2').classList.add('show');
  } else {
    sortAttempts++;
    fb.className = 'feedback show ko';
    fb.textContent = '❌ El orden no es correcto todavía. Recuerda que la acción es el último paso, y la cámara el primero.';
    document.getElementById('btn-sol2').classList.add('show');
  }
}

function showSortSolution() {
  sortDone = true;
  const list = document.getElementById('sort-list');
  list.innerHTML = '';
  sortCorrect.forEach((id, i) => {
    const item = sortItems.find(x => x.id === id);
    const div = document.createElement('div');
    div.className = 'sort-item';
    div.dataset.id = item.id;
    div.innerHTML = `<div class="sort-num">${i+1}</div><span>${item.text}</span>`;
    list.appendChild(div);
  });
  const fb = document.getElementById('fb-sort');
  fb.className = 'feedback show ok';
  fb.textContent = '💡 Solución: Aquí tienes el flujo secuencial de la visión artificial.';
  disableDrag();
  document.getElementById('btn-sol2').classList.remove('show');
  document.getElementById('btn-sig2').classList.add('show');
}

// ─── JUEGO 3: EMPAREJAR (5 Conceptos) ─────────────────────────────────────────
const matchPairs = [
  { left: '📷 Cámara frontal', right: 'Ve hacia adelante y detecta semáforos, peatones y obstáculos' },
  { left: '🟡 Sensor ultrasonidos', right: 'Mide la distancia física al obstáculo más cercano' },
  { left: '🔍 Reconocimiento de imagen', right: 'Identificar qué objeto concreto aparece en la imagen' },
  { left: '🚦 VER CON CÁMARA', right: 'Bloque nuevo para habilitar la percepción visual del robot' },
  { left: '💡 Faros delanteros', right: 'Se intensifican al frenar para avisar a otros vehículos' }
];
let matchSelected = null;
let matchDone = 0;
let matchAutoCount = 0;

function game3() {
  matchSelected = null;
  matchDone = 0;
  matchAutoCount = 0;
  
  const leftItems = shuffleArray([0, 1, 2, 3, 4]).map(i => ({ idx: i, text: matchPairs[i].left }));
  const rightItems = shuffleArray([0, 1, 2, 3, 4]).map(i => ({ idx: i, text: matchPairs[i].right }));

  const html = `
    <div class="game-card">
      <div class="game-title">🔗 Emparejar · Componentes de Conducción</div>
      <div class="game-question">Pulsa un componente de la izquierda y luego su función correspondiente en la derecha.</div>
      <div class="match-grid">
        <div class="match-col" id="left-col">
          ${leftItems.map(item => `<div class="match-item left" data-idx="${item.idx}" data-side="left" onclick="selectMatch(this)">${item.text}</div>`).join('')}
        </div>
        <div class="match-col" id="right-col">
          ${rightItems.map(item => `<div class="match-item right" data-idx="${item.idx}" data-side="right" onclick="selectMatch(this)">${item.text}</div>`).join('')}
        </div>
      </div>
      <div class="feedback" id="fb-match"></div>
      <button class="btn-solucion" id="btn-sol3" onclick="showMatchSolution()">VER SOLUCIÓN 💡</button>
      <button class="btn-siguiente" id="btn-sig3" onclick="nextGame()">SIGUIENTE JUEGO →</button>
      <button class="btn-reiniciar" onclick="game3()">REINICIAR JUEGO</button>
    </div>`;
  document.getElementById('game-area').innerHTML = html;
}

function selectMatch(el) {
  if (el.classList.contains('matched') || el.classList.contains('match-ok')) return;
  const side = el.dataset.side;
  if (!matchSelected) {
    if (side !== 'left') return;
    matchSelected = el;
    el.classList.add('selected');
  } else {
    if (side !== 'right') {
      matchSelected.classList.remove('selected');
      el.classList.add('selected');
      matchSelected = el;
      return;
    }
    const idxA = parseInt(matchSelected.dataset.idx);
    const idxB = parseInt(el.dataset.idx);
    if (idxA === idxB) {
      matchSelected.classList.remove('selected');
      matchSelected.classList.add('matched', 'match-ok');
      el.classList.add('matched', 'match-ok');
      matchDone++;
      if (matchDone === matchPairs.length) {
        const ownMatches = matchPairs.length - matchAutoCount;
        updateScore(ownMatches * 6);
        const fb = document.getElementById('fb-match');
        fb.className = 'feedback show ok';
        fb.textContent = '✅ ¡Excelente! Has asociado todos los componentes correctamente.';
        document.getElementById('btn-sol3').classList.remove('show');
        document.getElementById('btn-sig3').classList.add('show');
      }
    } else {
      matchSelected.classList.remove('selected');
      matchSelected.classList.add('match-ko');
      el.classList.add('match-ko');
      const prev = matchSelected;
      setTimeout(() => { prev.classList.remove('match-ko'); el.classList.remove('match-ko'); }, 600);
      document.getElementById('btn-sol3').classList.add('show');
    }
    matchSelected = null;
  }
}

function showMatchSolution() {
  const lefts = document.querySelectorAll('#left-col .match-item');
  const rights = document.querySelectorAll('#right-col .match-item');
  
  lefts.forEach(l => {
    if (!l.classList.contains('matched')) l.classList.add('matched', 'match-ok');
  });
  rights.forEach(r => {
    if (!r.classList.contains('matched')) r.classList.add('matched', 'match-ok');
  });
  
  matchAutoCount = matchPairs.length - matchDone;
  matchDone = matchPairs.length;
  
  const fb = document.getElementById('fb-match');
  fb.className = 'feedback show ok';
  fb.textContent = '💡 Solución: Aquí tienes las parejas formadas.';
  document.getElementById('btn-sol3').classList.remove('show');
  document.getElementById('btn-sig3').classList.add('show');
}

// ─── JUEGO 4: RETO FINAL (4 Escenarios de Semáforo) ──────────────────────────
const scenarios = [
  {
    luz: 'rojo',
    texto: "El coche se aproxima al cruce. La cámara frontal capta el semáforo y analiza que la luz encendida es ROJO.",
    opts: [
      "🛑 Frenar y detenerse antes del semáforo",
      "🟢 Continuar avanzando a velocidad constante",
      "↩️ Girar a la izquierda inmediatamente",
      "📷 Activar los sensores de aparcamiento"
    ],
    ok: 0,
    ex: "✅ ¡Correcto! La cámara lee el semáforo y el coche frena y espera a que cambie a verde."
  },
  {
    luz: 'verde',
    texto: "El semáforo estaba en rojo y el coche parado. De repente, la luz encendida pasa a ser VERDE.",
    opts: [
      "🛑 Mantenerse parado esperando al conductor",
      "🟢 Arrancar y avanzar por el cruce",
      "↩️ Retroceder marcha atrás por seguridad",
      "📷 Realizar una foto del entorno"
    ],
    ok: 1,
    ex: "✅ ¡Exacto! El reconocimiento visual detecta la transición a verde y da la orden de arranque."
  },
  {
    luz: 'amarillo',
    texto: "El coche avanza. A lo lejos, la cámara detecta que la luz del semáforo cambia a AMARILLO.",
    opts: [
      "🛑 Frenar suavemente para detenerse con seguridad",
      "🟢 Acelerar para pasar antes de que cambie a rojo",
      "↩️ Frenar de golpe bloqueando las ruedas",
      "📷 Apagar la cámara frontal"
    ],
    ok: 0,
    ex: "✅ ¡Correcto! Al estar a distancia, lo seguro es frenar con anticipación para detenerse en el semáforo."
  },
  {
    luz: 'verde',
    texto: "El semáforo está en verde, pero la cámara de seguridad detecta un peatón cruzando la calzada.",
    opts: [
      "🟢 Seguir avanzando (el coche tiene preferencia en verde)",
      "🛑 Esperar a que el peatón termine de cruzar",
      "↩️ Tocar el claxon y acelerar para apartarlo",
      "📷 Reiniciar el sistema de navegación"
    ],
    ok: 1,
    ex: "✅ ¡Perfecto! La seguridad de los peatones es la prioridad absoluta. Aunque el semáforo esté en verde, el coche frena."
  }
];

let scIdx = 0;
let scAnswered = false;
let scAttempts = 0;

function game4() {
  scIdx = 0;
  renderScenario();
}

function renderScenario() {
  if (scIdx >= scenarios.length) { nextGame(); return; }
  const s = scenarios[scIdx];
  scAnswered = false;
  scAttempts = 0;

  const shuffled = shuffleArray([0, 1, 2, 3]);
  const correctShuffled = shuffled.indexOf(s.ok);
  
  const luces = ['rojo', 'amarillo', 'verde'].map(c => `
    <div class="luz ${c} ${c === s.luz ? 'on' : ''}"></div>
  `).join('');

  const html = `
    <div class="game-card">
      <div class="game-title">🎯 Reto Final · Semáforo ${scIdx+1} de ${scenarios.length}</div>
      
      <div class="semaforo-wrap">
        <div class="semaforo-box">
          ${luces}
        </div>
        <div style="flex: 1; text-align: left;">
          <div class="if-stat" style="margin-bottom: 10px;">
            <div class="if-stat-l">Coche Autónomo HUD</div>
            <div class="if-stat-v" style="font-size: 16px; color: #ddd; margin-top: 6px;">
              👁️ Detección: Semáforo [${s.luz.toUpperCase()}]<br>
              ⚙️ Freno motor: <span style="color: ${s.luz === 'verde' && !s.texto.includes('peatón') ? '#00ff88' : '#ff6644'}">
                ${s.luz === 'verde' && s.texto.includes('peatón') ? 'Frenada activa' : (s.luz === 'verde' ? 'Liberado' : 'Frenado')}
              </span>
            </div>
          </div>
          <div style="font-size: 16px; color: var(--sub); line-height: 1.5;">
            ${s.texto}
          </div>
          ${s.luz === 'verde' && s.texto.includes('peatón') ? `<div class="hud-banner">⚠️ PEATÓN DETECTADO EN CALZADA</div>` : ''}
        </div>
      </div>

      <div class="game-question">¿Qué decisión debe tomar el coche robot?</div>
      <div class="options-grid" id="ifops">
        ${shuffled.map((i, pos) => `
          <button class="opt-btn" onclick="answerScenario(this, ${pos}, ${correctShuffled})">${s.opts[i]}</button>
        `).join('')}
      </div>
      <div class="feedback" id="fb-f"></div>
      <button class="btn-solucion" id="btn-solf" onclick="showScenarioSolution(${correctShuffled})">VER SOLUCIÓN 💡</button>
      <button class="btn-siguiente" id="btn-sigf" onclick="scenarioNext()">${scIdx < scenarios.length - 1 ? 'SIGUIENTE ▶' : 'VER RESULTADO FINAL ▶'}</button>
      <button class="btn-reiniciar" onclick="game4()">REINICIAR JUEGO</button>
    </div>`;

  document.getElementById('game-area').innerHTML = html;
}

function answerScenario(btn, pos, correctPos) {
  if (scAnswered) return;
  const s = scenarios[scIdx];
  const btns = document.querySelectorAll('#ifops .opt-btn');
  const fb = document.getElementById('fb-f');
  if (pos === correctPos) {
    scAnswered = true;
    btns.forEach(b => b.disabled = true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = s.ex;
    if (scAttempts === 0) {
      updateScore(25);
    } else {
      updateScore(12);
    }
    document.getElementById('btn-solf').classList.remove('show');
    document.getElementById('btn-sigf').classList.add('show');
  } else {
    scAttempts++;
    btn.classList.add('wrong');
    btn.disabled = true;
    fb.className = 'feedback show ko';
    fb.textContent = '❌ No es esa. ¡Inténtalo de nuevo!';
    document.getElementById('btn-solf').classList.add('show');
  }
}

function showScenarioSolution(correctPos) {
  scAnswered = true;
  const s = scenarios[scIdx];
  const btns = document.querySelectorAll('#ifops .opt-btn');
  btns.forEach(b => {
    b.disabled = true;
    b.classList.remove('wrong');
  });
  btns[correctPos].classList.add('correct');
  const fb = document.getElementById('fb-f');
  fb.className = 'feedback show ok';
  fb.textContent = '💡 Solución: ' + s.ex;
  document.getElementById('btn-solf').classList.remove('show');
  document.getElementById('btn-sigf').classList.add('show');
}

function scenarioNext() { scIdx++; renderScenario(); }

// ─── FINAL ───────────────────────────────────────────────────────────────────
function showFinal() {
  document.getElementById('progress-bar').style.display = 'none';
  const trofeo = score >= 230 ? '🏆' : score >= 180 ? '🥈' : '🎖️';
  const msg = score >= 230
    ? '¡Excelente! Eres un experto en sistemas de visión artificial y control autónomo.'
    : score >= 180
    ? '¡Muy bien! Sabes perfectamente cómo interpreta la cámara las luces del semáforo.'
    : '¡Buen trabajo! Un poco de repaso sobre cómo procesa el coche las imágenes y ganarás el oro.';
    
  document.getElementById('game-area').innerHTML = `
    <div id="final-screen" style="display:flex">
      <div class="trophy">${trofeo}</div>
      <div class="final-title">¡REPASO COMPLETADO!</div>
      <div class="final-score">⭐ ${score} puntos · ${msg}</div>
      <button class="btn-replay" onclick="iniciar()">JUGAR OTRA VEZ</button>
    </div>`;
}

function escHtml(s) {
  return s.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

const games = [game1, game2, game3, game4];
