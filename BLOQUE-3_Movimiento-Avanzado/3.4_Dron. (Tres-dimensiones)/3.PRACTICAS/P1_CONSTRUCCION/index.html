<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Dron - Babylon.js</title>
    <style>
        :root {
            --cyan: #00f2ff;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #uiContainer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        
        /* 🕹️ CONTROLES VIRTUALES */
        #virtual-controls { position: absolute; inset: 0; pointer-events: none; z-index: 50; display: block; }
        
        #throttle-bg { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); width: 60px; height: 350px; background: rgba(0, 20, 40, 0.7); border: 2px solid rgba(0, 242, 255, 0.4); border-radius: 30px; pointer-events: auto; cursor: ns-resize; display: flex; justify-content: center; box-shadow: 0 0 25px rgba(0,0,0,0.9); }
        #throttle-track { position: absolute; top: 30px; bottom: 30px; width: 6px; background: var(--cyan); opacity: 0.6; border-radius: 3px; box-shadow: 0 0 10px var(--cyan); }
        #throttle-knob { position: absolute; left: 5px; width: 50px; height: 70px; background: linear-gradient(180deg, #444, #111); border: 2px solid var(--cyan); border-radius: 12px; top: 140px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 5px; }
        .t-grip { width: 25px; height: 4px; background: #777; border-radius: 2px; }
        #throttle-label { position: absolute; bottom: -35px; width: 100%; text-align: center; color: var(--cyan); font-size: 14px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 5px #000;}

        #joystick-bg { position: absolute; right: 50px; top: 50%; transform: translateY(-50%); width: 260px; height: 260px; background: radial-gradient(circle, rgba(0, 30, 60, 0.7) 0%, rgba(0,0,0,0.6) 100%); border: 3px solid rgba(0, 242, 255, 0.3); border-radius: 50%; pointer-events: auto; cursor: crosshair; box-shadow: inset 0 0 30px rgba(0,242,255,0.2), 0 0 25px rgba(0,0,0,0.9); }
        #joystick-bg::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(0, 242, 255, 0.2); transform: translateY(-50%); }
        #joystick-bg::after { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: rgba(0, 242, 255, 0.2); transform: translateX(-50%); }
        #joystick-knob { position: absolute; left: 90px; top: 90px; width: 80px; height: 80px; background: radial-gradient(circle at 30% 30%, #666, #111); border: 3px solid var(--cyan); border-radius: 50%; box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,242,255,0.6); pointer-events: none; transition: transform 0.1s ease-out; }
        
        @keyframes blinkAlarm {
            0% { opacity: 1; transform: translateX(-50%) scale(1); box-shadow: 0 0 20px red; }
            100% { opacity: 0.2; transform: translateX(-50%) scale(1.05); box-shadow: 0 0 0px red; }
        }
    </style>
    <!-- Incluir Babylon.js y Cannon.js para las físicas -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Loaders for GLTF/GLB -->
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- Cannon.js for Physics -->
    <script src="https://cdn.babylonjs.com/cannon.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="uiContainer" style="z-index: 10; left: 120px;">
        <h2>Panel de Vuelo Básico 5.5</h2>
        <p>FLECHA ARRIBA: Acelerar (Subir)</p>
        <p>FLECHA ABAJO: Desacelerar (Bajar)</p>
        <p>FLECHA IZQ/DER: Girar (Yaw)</p>
        <br>
        <p>TECLAS W/S: Avanzar / Retroceder</p>
        <p>TECLAS A/D: Moverse de lado</p>
        <button id="btnEngine" style="margin-top: 10px; font-size: 18px; font-weight: bold; padding: 10px 20px; background-color: #ff4444; color: white; border: 2px solid white; border-radius: 8px; cursor: pointer; text-shadow: 1px 1px 2px black; pointer-events: auto;">Arrancar Motores (ESPACIO)</button>
    </div>

    <script src="droneBase64.js"></script>
    <script src="app.js"></script>
</body>
</html>
