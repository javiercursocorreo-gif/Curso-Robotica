<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>P1 - Conoce a Mecha</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        #renderCanvas { width: 100%; height: 100vh; touch-action: none; }
        
        #uiContainer {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            align-items: center;
            max-width: 250px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        #btnToggle {
            background-color: #4CAF50;
            color: white;
        }
        
        #btnToggle:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        
        #btnToggle.stopped {
            background-color: #f44336;
        }
        
        #btnToggle.stopped:hover {
            background-color: #e53935;
        }
        
        .info-text {
            color: white;
            font-size: 1.2rem;
            text-align: center;
        }
        
        #title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 10px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="title">INSPECCIÓN DEL MECHA</div>

<div id="uiContainer">
    <div class="info-text">Explora el modelo 3D arrastrando con el ratón.<br>Usa el botón para probar las animaciones.</div>
    <button id="btnToggle">PARAR ANIMACIÓN</button>
</div>

<canvas id="renderCanvas"></canvas>

<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    let mainAnimGroup = null;
    let isPlaying = true;
    
    const createScene = async function () {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.15, 1);

        // Cámara ArcRotate para permitir inspección 360 grados
        const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 4, Math.PI / 3, 10, new BABYLON.Vector3(0, 3, 0), scene);
        camera.attachControl(canvas, true);
        camera.wheelPrecision = 50;
        camera.minZ = 0.1;
        camera.lowerRadiusLimit = 3;
        camera.upperRadiusLimit = 30;

        // Iluminación
        const light = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
        light.intensity = 1.5;
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemi.intensity = 1.5;
        
        // Suelo con grid
        const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 20}, scene);
        const mat = new BABYLON.StandardMaterial("groundMat", scene);
        mat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
        mat.wireframe = true;
        ground.material = mat;

        // Cargar Modelo
        const modelPath = "../1.FICHEROS-AUXILIARES/mech_neck_walker_-_bge_free_download.glb";
        const result = await BABYLON.SceneLoader.ImportMeshAsync("", modelPath, "", scene);
        
        // Ajustar escala y posición
        const rootNode = result.meshes[0];
        rootNode.scaling = new BABYLON.Vector3(0.5, 0.5, 0.5);
        
        // Guardar referencia al grupo de animaciones
        if (result.animationGroups && result.animationGroups.length > 0) {
            mainAnimGroup = result.animationGroups[0];
            // Reproducir animación de espera por defecto (0 a 554) para no reproducir todo el buffer
            mainAnimGroup.start(true, 1.0, 0, 554);
        }
        
        return scene;
    };

    createScene().then(scene => {
        engine.runRenderLoop(() => { scene.render(); });
        
        // Configurar botón
        const btnToggle = document.getElementById("btnToggle");
        btnToggle.addEventListener("click", () => {
            if (!mainAnimGroup) return;
            
            if (isPlaying) {
                mainAnimGroup.pause();
                btnToggle.innerText = "ARRANCAR ANIMACIÓN";
                btnToggle.classList.add("stopped");
            } else {
                mainAnimGroup.play(true);
                btnToggle.innerText = "PARAR ANIMACIÓN";
                btnToggle.classList.remove("stopped");
            }
            isPlaying = !isPlaying;
        });
    });
    
    window.addEventListener("resize", () => { engine.resize(); });
</script>
</body>
</html>
