<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Robot Aspiradora - Ingeniería de Precisión</title>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@latest/build/three.module.js"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #00f2ff;
            --primary-glow: rgba(0, 242, 255, 0.4);
            --success: #00e676;
            --success-glow: rgba(0, 230, 118, 0.4);
            --bg: #0b0f19;
            --glass: rgba(20, 28, 46, 0.85);
            --glass-border: rgba(0, 242, 255, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Outfit', 'Inter', sans-serif;
            color: white;
            user-select: none;
        }

        /* CUSTOM SCROLLBARS */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #header-bar {
            position: absolute;
            top: 0; width: 100%;
            height: 70px;
            background: linear-gradient(180deg, rgba(8, 12, 24, 0.95) 0%, rgba(15, 20, 35, 0.85) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 25px rgba(0, 242, 255, 0.2);
        }

        #main-title {
            letter-spacing: 4px;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(90deg, #00f2ff, #3a88fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
            text-transform: uppercase;
        }

        #ui-wrapper {
            position: relative;
            display: flex;
            width: 100%; height: 100%;
            z-index: 10;
            padding-top: 70px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .side-panel-left {
            width: 330px;
            height: calc(100% - 24px);
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 22px;
            margin: 12px;
            display: flex;
            flex-direction: column;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .inventory-section {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        #inv-container {
            overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
            padding-right: 4px;
        }

        .inv-item { 
            font-size: 13px; 
            padding: 8px 6px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            color: #8899aa; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
            border-radius: 6px;
        }
        .inv-item:hover { background: rgba(255,255,255,0.03); color: #ccc; }
        .inv-item.active { color: #fff; font-weight: 700; background: rgba(0, 230, 118, 0.1); border-left: 3px solid var(--success); padding-left: 8px; }

        .side-panel-right {
            width: 390px;
            height: calc(100% - 24px);
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 22px;
            margin: 12px;
            display: flex;
            flex-direction: column;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            box-sizing: border-box;
        }

        .tray-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            overflow-y: auto;
            padding-right: 6px;
            padding-bottom: 6px;
        }

        .piece-card {
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.12) 0%, rgba(0, 136, 255, 0.04) 100%);
            border: 1px solid rgba(0, 242, 255, 0.3);
            color: #ffffff;
            padding: 14px 10px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .piece-card:hover { 
            background: linear-gradient(135deg, #00f2ff 0%, #0088ff 100%); 
            color: #000; 
            transform: translateY(-4px) scale(1.04); 
            box-shadow: 0 8px 25px var(--primary-glow);
            border-color: #fff;
        }
        .piece-card:active { cursor: grabbing; transform: scale(0.98); }
        .piece-card.installed { opacity: 0.15; pointer-events: none; filter: grayscale(1); transform: none; box-shadow: none; }
        .piece-card .icon { font-size: 32px; margin-bottom: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }

        #center-zone {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .info-header { font-size: 12px; color: var(--primary); font-weight: 800; margin-bottom: 10px; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);}
        .part-name-display { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .part-desc-display { font-size: 14px; color: #b0c0d0; line-height: 1.5; margin-bottom: 14px; }

        #test-panel {
            display: none;
            padding: 14px;
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid var(--success);
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 0 20px var(--success-glow);
        }

        .btn-confirm {
            display: none; width: 100%; min-height: 52px; 
            background: linear-gradient(90deg, #00e676, #00b359); 
            color: #000;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer;
            letter-spacing: 1px; transition: all 0.2s;
            box-shadow: 0 4px 15px var(--success-glow);
        }
        .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--success-glow); background: #33ff99; }
        .btn-confirm:active { transform: translateY(1px); }

        .btn-skip {
            width: 100%; height: 42px; background: rgba(255,255,255,0.04); color: #99aabb;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; font-size: 12px; font-weight: 600;
            cursor: pointer; margin-top: 10px; transition: all 0.2s; letter-spacing: 0.5px;
        }
        .btn-skip:hover { background: rgba(255, 68, 68, 0.15); border-color: #ff4444; color: #ff4444; }

        .drop-zone-visual {
            width: 320px; height: 320px;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; color: var(--primary); font-size: 20px; font-weight: 800; letter-spacing: 2px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.15), inset 0 0 40px rgba(0, 242, 255, 0.15);
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; border-color: #fff; }
        }

    </style>
</head>
<body>

    <div id="header-bar"><div id="main-title">MONTAJE DEL ROBOT ASPIRADORA</div></div>
    
    <div id="canvas-container"></div>

    <div id="ui-wrapper">
        <div class="side-panel-left">
            <div class="inventory-section">
                <div class="info-header">COMPONENTES INSTALADOS</div>
                <div id="inv-container"></div>
            </div>

            <div class="info-header">PIEZA ACTUAL</div>
            <div class="part-name-display" id="active-part-name">Elige una pieza</div>
            <div class="part-desc-display" id="active-part-desc">Arrastra un componente de la bandeja derecha para instalarlo.</div>
        </div>

        <div id="center-zone" ondragover="event.preventDefault()" ondrop="onPieceDrop(event)">
            <div class="drop-zone-visual" id="drop-visual">SUELTA AQUÍ</div>
        </div>

        <div class="side-panel-right">
            <div class="info-header" style="margin-bottom: 10px;">BANDEJA DE PIEZAS</div>
            <div class="tray-grid" id="tray-container"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const PARTS_DB = [
            { id: 0, name: "CHASIS BASE", icon: "💿", desc: "La base circular sobre la que se monta todo.", color: 0x888888 },
            { id: 1, name: "RUEDA IZQUIERDA", icon: "⚫", desc: "Tracción trasera izquierda.", color: 0x222222 },
            { id: 2, name: "EJE IZQUIERDO", icon: "🔩", desc: "Une el motor con la rueda izquierda.", color: 0xcccccc },
            { id: 3, name: "RUEDA DERECHA", icon: "⚫", desc: "Tracción trasera derecha.", color: 0x222222 },
            { id: 4, name: "EJE DERECHO", icon: "🔩", desc: "Une el motor con la rueda derecha.", color: 0xcccccc },
            { id: 5, name: "MOTOR IZQUIERDO", icon: "🔵", desc: "Motor de tracción izquierda.", color: 0x0044ff },
            { id: 6, name: "CABLE MOTOR IZQ.", icon: "〰️", desc: "Cable de alimentación visible desde el motor izquierdo.", color: 0xff4400 },
            { id: 7, name: "MOTOR DERECHO", icon: "🔵", desc: "Motor de tracción derecha.", color: 0x0044ff },
            { id: 8, name: "CABLE MOTOR DER.", icon: "〰️", desc: "Cable de alimentación visible desde el motor derecho.", color: 0xff4400 },
            { id: 9, name: "BATERÍA", icon: "🟩", desc: "Fuente de energía trasera.", color: 0x00aa44 },
            { id: 10, name: "CABLE DE BATERÍA", icon: "〰️", desc: "Cableado central de distribución.", color: 0xffcc00 },
            { id: 11, name: "INFRARROJO OBSTÁCULOS", icon: "🟡", desc: "Haz óptico frontal para detectar paredes y muebles sin colisionar.", color: 0xffcc00 },
            { id: 12, name: "CEPILLO IZQUIERDO", icon: "🌀", desc: "Barredor frontal izquierdo.", color: 0x00ccff },
            { id: 13, name: "CEPILLO DERECHO", icon: "🌀", desc: "Barredor frontal derecho.", color: 0x00ccff },
            { id: 14, name: "FILTRO DE POLVO", icon: "🟪", desc: "Depósito de residuos trasero.", color: 0x8800cc },
            { id: 15, name: "BOTÓN DE ENCENDIDO", icon: "🔴", desc: "Interruptor superior central.", color: 0xff0000 },
            { id: 16, name: "SENSORES DE VACÍO (CLIFF)", icon: "🕳️", desc: "4 sensores infrarrojos en la base mirando al suelo para evitar caer por escalones.", color: 0xff5500 },
            { id: 17, name: "ACELERÓMETRO DE IMPACTO", icon: "⚡", desc: "Detecta desaceleraciones bruscas y choques mecánicos en el parachoques.", color: 0xcc00ff },
            { id: 18, name: "GIRÓSCOPO ESTABILIDAD", icon: "⚖️", desc: "Mide rotaciones y giros angulares exactos para navegar en líneas rectas y zig-zag.", color: 0x00ffaa },
            { id: 19, name: "MAGNETÓMETRO (BRÚJULA)", icon: "🧭", desc: "Brújula digital que orienta al robot respecto a los puntos cardinales de la estancia.", color: 0x0088ff }
        ];

        let installedCount = 0;
        let activePartId = null;
        let scene, camera, renderer, robotGroup, clock;
        let meshes = {};

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 80);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.4;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
            const sun = new THREE.DirectionalLight(0xffffff, 3);
            sun.position.set(5, 10, 5);
            sun.castShadow = true;
            scene.add(sun);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.5;
            scene.add(floor);

            robotGroup = new THREE.Group();
            scene.add(robotGroup);

            clock = new THREE.Clock();
            window.addEventListener('resize', onResize);
            
            setupTray();
            setupInventoryList();
            loop();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupTray() {
            const container = document.getElementById('tray-container');
            container.innerHTML = '';
            PARTS_DB.forEach(part => {
                const card = document.createElement('div');
                card.className = 'piece-card';
                card.id = `tray-part-${part.id}`;
                card.draggable = true;
                card.innerHTML = `<div class="icon">${part.icon}</div><div>${part.name}</div>`;
                card.ondragstart = (e) => {
                    e.dataTransfer.setData("partId", part.id);
                };
                container.appendChild(card);
            });
        }

        function setupInventoryList() {
            const container = document.getElementById('inv-container');
            container.innerHTML = '';
            PARTS_DB.forEach(part => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.id = `inv-part-${part.id}`;
                div.innerHTML = `<span>${part.icon} ${part.name}</span> <span class="check"></span>`;
                container.appendChild(div);
            });
        }

        window.onPieceDrop = (e) => {
            e.preventDefault();
            const id = parseInt(e.dataTransfer.getData("partId"));
            if(isNaN(id) || meshes[id]) return;

            activePartId = id;
            const part = PARTS_DB[id];
            spawnMesh(id);

            // Instalación inmediata y ágil al soltar
            document.getElementById(`tray-part-${id}`).classList.add('installed');
            const invItem = document.getElementById(`inv-part-${id}`);
            invItem.classList.add('active');
            invItem.querySelector('.check').innerText = "✓";
            invItem.querySelector('.check').style.color = "var(--success)";

            installedCount++;
            document.getElementById('drop-visual').style.visibility = 'visible';
            document.getElementById('active-part-desc').innerText = "✓ " + part.name + " instalada correctamente";

            if(installedCount === PARTS_DB.length) {
                finishAssembly();
            }
        };

        function finishAssembly() {
            document.getElementById('drop-visual').style.visibility = 'hidden';
            document.getElementById('active-part-name').innerText = "¡MONTAJE COMPLETADO!";
            document.getElementById('active-part-desc').innerHTML = "<b style='color:var(--primary); font-size:15px;'>¡Enhorabuena! El robot aspirador Roomba está 100% ensamblado con toda su sensórica avanzada.</b><br><br>Pasa a la práctica <b>P2 (Ejemplo Real)</b> para ver su funcionamiento en acción por la habitación.";
            const btnSkip = document.querySelector('.btn-skip');
            if(btnSkip) btnSkip.style.display = 'none';
        }

        window.skipConstruction = function() {
            PARTS_DB.forEach(part => { 
                if(!meshes[part.id]) {
                    spawnMesh(part.id);
                    document.getElementById(`tray-part-${part.id}`).classList.add('installed');
                    const invItem = document.getElementById(`inv-part-${part.id}`);
                    invItem.classList.add('active');
                    invItem.querySelector('.check').innerText = "✓";
                    invItem.querySelector('.check').style.color = "var(--success)";
                }
            });
            installedCount = PARTS_DB.length;
            finishAssembly();
        };

        function spawnMesh(idx) {
            const mat = new THREE.MeshPhysicalMaterial({ color: PARTS_DB[idx].color, metalness: 0.7, roughness: 0.1, emissive: new THREE.Color(0,0,0) });
            let mesh;

            switch(idx) {
                case 0: mesh = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.4, 64), mat); break;
                // IZQUIERDA
                case 1: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 32), mat); mesh.rotation.z = Math.PI/2; mesh.position.set(-2.2, 0.2, 0); break; 
                case 2: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4, 16), mat); mesh.rotation.z = Math.PI/2; mesh.position.set(-1.4, 0.2, 0); break; 
                case 5: mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), mat); mesh.position.set(-0.8, 0.4, 0); break; 
                
                // CABLE IZQUIERDO: Sale del lateral del motor y va al lateral de la batería
                case 6: {
                    const start = new THREE.Vector3(-0.6, 0.65, 0); // Costado interno del motor
                    const end = new THREE.Vector3(-0.4, 0.65, 0.6); // Lateral izquierdo de la batería
                    const distance = start.distanceTo(end);
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, distance), mat);
                    mesh.position.copy(start.clone().lerp(end, 0.5));
                    mesh.lookAt(end);
                    break;
                }
                case 12: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.05, 32), mat); mesh.position.set(-1.8, 0.15, -1.6); break; 
                case 16: {
                    const group = new THREE.Group();
                    const g = new THREE.CylinderGeometry(0.12, 0.12, 0.15, 16);
                    const coords = [{x: -1.3, z: -1.3}, {x: -0.65, z: -1.65}, {x: 0.65, z: -1.65}, {x: 1.3, z: -1.3}];
                    coords.forEach(pos => {
                        const s = new THREE.Mesh(g, mat);
                        s.position.set(pos.x, 0, pos.z);
                        group.add(s);
                    });
                    mesh = group;
                    mesh.position.set(0, 0.28, 0);
                    break;
                }

                // DERECHA
                case 3: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 32), mat); mesh.rotation.z = Math.PI/2; mesh.position.set(2.2, 0.2, 0); break; 
                case 4: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4, 16), mat); mesh.rotation.z = Math.PI/2; mesh.position.set(1.4, 0.2, 0); break; 
                case 7: mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), mat); mesh.position.set(0.8, 0.4, 0); break; 
                
                // CABLE DERECHO: Sale del lateral del motor y va al lateral de la batería
                case 8: {
                    const start = new THREE.Vector3(0.6, 0.65, 0); // Costado interno del motor
                    const end = new THREE.Vector3(-0.4, 0.65, 0.6); // Lateral derecho de la batería
                    const distance = start.distanceTo(end);
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, distance), mat);
                    mesh.position.copy(start.clone().lerp(end, 0.5));
                    mesh.lookAt(end);
                    break;
                }
                case 13: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.05, 32), mat); mesh.position.set(1.8, 0.15, -1.6); break; 
                case 17: mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.3), mat); mesh.position.set(0, 0.32, -1.05); break; // Acelerómetro de impacto

                // CENTRALES
                case 9: mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.8), mat); mesh.position.set(0, 0.4, 0.6); break; 
                case 10: mesh = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 1.2), mat); mesh.position.set(0, 0.68, -0.2); break; 
                case 11: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.25, 32), mat); mesh.position.set(0, 0.35, -1.65); break; // Infrarrojo de obstáculos (torreta/domo en punta)
                case 14: mesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.15, 0.6), mat); mesh.position.set(0, 0.35, 1.4); break; 
                case 15: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.2, 32), mat); mesh.position.set(0, 0.85, -0.4); break; 
                case 18: mesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.4), mat); mesh.position.set(0.9, 0.32, -0.9); break; // Giróscopo
                case 19: mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.12, 16), mat); mesh.position.set(-0.9, 0.32, -0.9); break; // Magnetómetro (Brújula)
            }

            mesh.castShadow = true;
            const targetY = mesh.position.y;
            mesh.position.y += 6;
            const drop = () => {
                if (mesh.position.y > targetY) {
                    mesh.position.y -= 0.3;
                    requestAnimationFrame(drop);
                } else { mesh.position.y = targetY; }
            };
            drop();
            robotGroup.add(mesh);
            meshes[idx] = mesh;
        }

        let smoothDt = 0.0166;
        function loop() {
            requestAnimationFrame(loop);
            let rawDt = clock.getDelta();
            if (rawDt > 0.1) rawDt = 0.1;
            smoothDt = smoothDt * 0.8 + rawDt * 0.2;

            // Rotación suave y fluida independiente de los FPS y vsync en Safari y Chrome
            robotGroup.rotation.y += 0.3 * smoothDt;
            
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
