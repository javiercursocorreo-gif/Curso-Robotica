<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2: Mezclador de Skins y Animaciones (Mixamo Retargeting)</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #e67e22;
            --bg: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.92);
            --border: rgba(255, 255, 255, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
            user-select: none;
        }

        #renderCanvas {
            width: 100%; height: 100%; touch-action: none; outline: none;
        }

        /* Barra Superior: Selector de Skin (Cuerpo) */
        #skinBar {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 12px; align-items: center;
            background: var(--panel-bg); padding: 10px 22px;
            border-radius: 40px; border: 1px solid var(--border);
            backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .bar-label {
            font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px;
            color: #94a3b8; text-transform: uppercase; margin-right: 6px;
        }
        .skin-btn {
            background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid var(--border);
            padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 0.88rem;
            cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; gap: 8px;
        }
        .skin-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .skin-btn.active {
            background: var(--primary); color: #06090e; border-color: var(--primary);
            box-shadow: 0 0 18px rgba(0, 210, 255, 0.5);
        }

        /* Panel Izquierdo: Selector de Animación (MOCAP) */
        #animPanel {
            position: absolute; top: 90px; left: 20px; width: 310px;
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px; z-index: 100;
            backdrop-filter: blur(12px); box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 12px;
        }
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border); padding-bottom: 8px;
        }
        .panel-title {
            font-size: 0.8rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; color: var(--accent);
        }
        .anim-list {
            display: flex; flex-direction: column; gap: 8px; max-height: 42vh; overflow-y: auto;
        }
        .anim-btn {
            background: rgba(255,255,255,0.05); color: #e2e8f0; border: 1px solid var(--border);
            padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; text-align: left;
            display: flex; justify-content: space-between; align-items: center;
        }
        .anim-btn:hover { background: rgba(255,255,255,0.12); color: #fff; transform: translateX(3px); }
        .anim-btn.active {
            background: linear-gradient(90deg, rgba(230, 126, 34, 0.25), rgba(230, 126, 34, 0.08));
            border-color: var(--accent); color: #ffedd5;
            box-shadow: 0 0 12px rgba(230, 126, 34, 0.35);
        }
        .anim-badge {
            font-size: 0.65rem; padding: 2px 6px; border-radius: 4px;
            background: rgba(0,0,0,0.4); color: #94a3b8; font-weight: 800;
        }

        /* Panel Derecho: Controles y Concepto Pedagógico */
        #ctrlPanel {
            position: absolute; top: 90px; right: 20px; width: 330px;
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px; z-index: 100;
            backdrop-filter: blur(12px); box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 16px;
        }
        .info-card {
            background: rgba(0,0,0,0.35); border-radius: 8px; padding: 12px;
            border-left: 3px solid var(--primary);
        }
        .info-title { font-size: 0.78rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; text-transform: uppercase; }
        .info-desc { font-size: 0.82rem; color: #cbd5e1; line-height: 1.45; }

        .ctrl-row {
            display: flex; gap: 8px;
        }
        .btn-action {
            flex: 1; background: rgba(255,255,255,0.08); color: white; border: 1px solid var(--border);
            padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.82rem;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-action:hover { background: rgba(255,255,255,0.18); }
        .btn-action.active { background: #3b82f6; border-color: #60a5fa; color: white; }

        .btn-random {
            background: linear-gradient(135deg, #8b5cf6, #ec4899); border: none;
            color: white; padding: 12px; border-radius: 10px; font-weight: 800;
            font-size: 0.88rem; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-random:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5); }

        .speed-control {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px;
        }
        .speed-label { font-size: 0.78rem; color: #94a3b8; font-weight: 700; }
        .speed-btns { display: flex; gap: 4px; }
        .speed-btn {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            color: #cbd5e1; font-size: 0.72rem; font-weight: 800; padding: 4px 8px;
            border-radius: 4px; cursor: pointer;
        }
        .speed-btn.active { background: var(--primary); color: #06090e; border-color: var(--primary); }

        /* Pantalla de Carga */
        #loadingScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.94); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; backdrop-filter: blur(8px);
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #loadingText { font-size: 1.1rem; font-weight: 700; color: #e2e8f0; }
    </style>
</head>
<body>

<div id="loadingScreen">
    <div class="spinner"></div>
    <div id="loadingText">Iniciando Mezclador de Skins...</div>
</div>

<!-- Selector de Skin Superior -->
<div id="skinBar">
    <span class="bar-label">Skin / Malla:</span>
    <button class="skin-btn active" data-skin="salsa">💃 Amy (Salsa)</button>
    <button class="skin-btn" data-skin="capoeira">🤸 The Boss (Capoeira)</button>
    <button class="skin-btn" data-skin="combate">⚔️ María Ong (Guerrera)</button>
</div>

<!-- Selector de Animación Izquierdo -->
<div id="animPanel">
    <div class="panel-header">
        <span class="panel-title">Animación / MOCAP</span>
        <span class="anim-badge" id="animBadge">Mixamo</span>
    </div>
    <div class="anim-list" id="animList">
        <!-- Generado dinámicamente -->
    </div>
</div>

<!-- Panel de Control y Concepto Derecho -->
<div id="ctrlPanel">
    <button class="btn-random" id="btnRandom">
        🎲 ¡MEZCLA ALEATORIA!
    </button>

    <div class="ctrl-row">
        <button class="btn-action" id="btnSkinning">
            💀 MOCAP (Rayos X)
        </button>
        <button class="btn-action" id="btnCameraReset">
            🎯 Centrar
        </button>
    </div>

    <div class="speed-control">
        <span class="speed-label">Velocidad:</span>
        <div class="speed-btns">
            <button class="speed-btn" data-speed="0.5">0.5x</button>
            <button class="speed-btn active" data-speed="1.0">1.0x</button>
            <button class="speed-btn" data-speed="1.5">1.5x</button>
        </div>
    </div>

    <div class="info-card">
        <div class="info-title">Concepto: Retargeting 3D</div>
        <div class="info-desc">
            Al compartir la misma jerarquía de huesos (<strong>Mixamo Rig</strong>), cualquier animación capturada por MOCAP puede aplicarse a cualquier modelo sin distorsión.
        </div>
    </div>

    <div class="info-card" style="border-left-color: var(--accent);">
        <div class="info-title" id="mixStatusTitle">Mezcla Actual</div>
        <div class="info-desc" id="mixStatusDesc">
            Cargando combinación...
        </div>
    </div>
</div>

<canvas id="renderCanvas"></canvas>

<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

    let scene = null;
    let camera = null;
    let activeMeshGroup = [];
    let skeletonViewer = null;
    let currentAnimGroup = null;
    let isXRay = false;
    let animSpeed = 1.0;

    let currentSkinKey = "salsa";
    let currentAnimKey = "salsa_base";

    // Catálogo de Skins (Cuerpos base con malla completa)
    const skins = {
        salsa: {
            name: "Amy (Bailarina)",
            folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Salsa/",
            file: "Salsa Dancing.glb",
            scale: 1.0,
            yOffset: 0
        },
        capoeira: {
            name: "The Boss (Capoeirista)",
            folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Capoeira/",
            file: "Chapaeu De Couro.glb",
            scale: 1.0,
            yOffset: 0
        },
        combate: {
            name: "María Ong (Guerrera)",
            folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Combate/",
            file: "Great Sword Walk.glb",
            scale: 1.0,
            yOffset: 0
        }
    };

    // Catálogo de Animaciones MOCAP disponibles para mezclar
    const animLibrary = [
        { id: "salsa_base", name: "Salsa: Paso Base", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Salsa/", file: "Salsa Dancing.glb", category: "Baile" },
        { id: "salsa_cruce", name: "Salsa: Cruce Elegante", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Salsa/", file: "Salsa Dancing-2.glb", category: "Baile" },
        { id: "salsa_giro", name: "Salsa: Giro Rápido", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Salsa/", file: "Salsa Dancing-3.glb", category: "Baile" },
        { id: "salsa_adorno", name: "Salsa: Adorno & Ritmo", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Salsa/", file: "Salsa Dancing-4.glb", category: "Baile" },
        { id: "cap_chapaeu", name: "Capoeira: Chapéu de Couro", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Capoeira/", file: "Chapaeu De Couro.glb", category: "Acrobacia" },
        { id: "cap_esquiva", name: "Capoeira: Esquiva Ágil", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Capoeira/", file: "Esquiva 1.glb", category: "Defensa" },
        { id: "cap_macaco", name: "Capoeira: Macaco Aéreo", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Capoeira/", file: "Macaco Side.glb", category: "Acrobacia" },
        { id: "cap_meia_lua", name: "Capoeira: Meia Lua Giratoria", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Capoeira/", file: "Meia Lua De Compasso Back.glb", category: "Ataque" },
        { id: "com_walk", name: "Combate: Marcha Pesada", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Combate/", file: "Great Sword Walk.glb", category: "Combate" },
        { id: "com_jump", name: "Combate: Salto con Mandoble", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Combate/", file: "Great Sword Jump.glb", category: "Combate" },
        { id: "com_kick", name: "Combate: Patada Táctica", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Combate/", file: "Great Sword Kick.glb", category: "Combate" },
        { id: "com_cast", name: "Combate: Invocación / Hechizo", folder: "../1.FICHEROS-AUXILIARES/MIXAMO/Combate/", file: "Great Sword Casting.glb", category: "Magia" }
    ];

    const initScene = () => {
        scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.04, 0.06, 0.1, 1);

        camera = new BABYLON.ArcRotateCamera("cam", Math.PI / 2, Math.PI / 2.2, 3.8, new BABYLON.Vector3(0, 0.8, 0), scene);
        camera.attachControl(canvas, true);
        camera.wheelPrecision = 60;
        camera.lowerRadiusLimit = 1.2;
        camera.upperRadiusLimit = 10;

        // Iluminación escénica
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemi.intensity = 0.5;

        const keyLight = new BABYLON.DirectionalLight("keyLight", new BABYLON.Vector3(-1, -2, 1), scene);
        keyLight.position = new BABYLON.Vector3(5, 10, -5);
        keyLight.intensity = 1.8;
        keyLight.diffuse = new BABYLON.Color3(0.9, 0.95, 1.0);

        const rimLight = new BABYLON.DirectionalLight("rimLight", new BABYLON.Vector3(1, -1, -1), scene);
        rimLight.position = new BABYLON.Vector3(-5, 5, 5);
        rimLight.intensity = 1.2;
        rimLight.diffuse = new BABYLON.Color3(0, 0.8, 1);

        // Suelo estilizado neón
        const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 14, height: 14 }, scene);
        const gMat = new BABYLON.StandardMaterial("gMat", scene);
        gMat.diffuseColor = new BABYLON.Color3(0.05, 0.08, 0.12);
        gMat.specularColor = new BABYLON.Color3(0.2, 0.4, 0.6);
        ground.material = gMat;

        // Círculo proyector bajo los pies
        const circle = BABYLON.MeshBuilder.CreateDisc("circle", { radius: 1.2, tessellation: 64 }, scene);
        circle.rotation.x = Math.PI / 2;
        circle.position.y = 0.01;
        const cMat = new BABYLON.StandardMaterial("cMat", scene);
        cMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
        cMat.emissiveColor = new BABYLON.Color3(0, 0.7, 1);
        cMat.wireframe = true;
        circle.material = cMat;
    };

    // Construir la lista de animaciones en la UI
    const buildAnimList = () => {
        const list = document.getElementById("animList");
        list.innerHTML = "";
        animLibrary.forEach(a => {
            const btn = document.createElement("button");
            btn.className = "anim-btn" + (a.id === currentAnimKey ? " active" : "");
            btn.innerHTML = `<span>${a.name}</span> <span class="anim-badge">${a.category}</span>`;
            btn.onclick = () => {
                if (currentAnimKey !== a.id) {
                    currentAnimKey = a.id;
                    updateAnimSelection();
                    applyAnimation(a);
                }
            };
            list.appendChild(btn);
        });
    };

    const updateAnimSelection = () => {
        const btns = document.querySelectorAll(".anim-btn");
        btns.forEach((btn, idx) => {
            btn.classList.toggle("active", animLibrary[idx].id === currentAnimKey);
        });
        updateStatusCard();
    };

    const updateStatusCard = () => {
        const skin = skins[currentSkinKey];
        const anim = animLibrary.find(a => a.id === currentAnimKey) || animLibrary[0];
        document.getElementById("mixStatusTitle").innerText = `${skin.name} + ${anim.category}`;
        document.getElementById("mixStatusDesc").innerHTML = `
            <strong>Malla / Skin:</strong> ${skin.name}<br>
            <strong>Movimiento MOCAP:</strong> ${anim.name}
        `;
    };

    // Cargar Skin y luego aplicarle la animación elegida
    const loadSkin = async (skinKey) => {
        const loading = document.getElementById("loadingScreen");
        const loadText = document.getElementById("loadingText");
        loading.style.display = "flex";
        loadText.innerText = `Cargando Skin: ${skins[skinKey].name}...`;

        currentSkinKey = skinKey;

        // Limpiar mallas y esqueletos previos
        activeMeshGroup.forEach(m => m.dispose());
        activeMeshGroup = [];
        if (skeletonViewer) {
            skeletonViewer.dispose();
            skeletonViewer = null;
        }
        scene.animationGroups.slice().forEach(ag => ag.dispose());

        const skinData = skins[skinKey];

        try {
            const res = await BABYLON.SceneLoader.ImportMeshAsync("", skinData.folder, skinData.file, scene);
            activeMeshGroup = res.meshes;
            
            // Apagar animación nativa embebida (la sobreescribiremos con retargeting)
            if (res.animationGroups.length > 0) {
                res.animationGroups[0].stop();
            }

            // Crear SkeletonViewer si el modo rayos X está activo
            if (res.skeletons && res.skeletons.length > 0) {
                skeletonViewer = new BABYLON.Debug.SkeletonViewer(res.skeletons[0], activeMeshGroup[0], scene, false, 3, {
                    displayMode: BABYLON.Debug.SkeletonViewer.DISPLAY_LINES
                });
                skeletonViewer.isEnabled = isXRay;
            }

            // Aplicar la animación actualmente seleccionada
            const targetAnim = animLibrary.find(a => a.id === currentAnimKey) || animLibrary[0];
            await applyAnimation(targetAnim, false);

            applyXRayState();
        } catch (err) {
            console.error("Error cargando skin:", err);
            loadText.innerText = "Error cargando modelo 3D.";
        } finally {
            loading.style.display = "none";
        }
    };

    // Aplicar animación usando Retargeting sobre el skin activo
    const applyAnimation = async (animData, showLoading = true) => {
        const loading = document.getElementById("loadingScreen");
        const loadText = document.getElementById("loadingText");
        if (showLoading) {
            loading.style.display = "flex";
            loadText.innerText = `Transfiriendo movimiento: ${animData.name}...`;
        }

        try {
            // Importar temporalmente el archivo que contiene la animación
            const tempRes = await BABYLON.SceneLoader.ImportMeshAsync("", animData.folder, animData.file, scene);
            const sourceAg = tempRes.animationGroups[0];

            if (currentAnimGroup) {
                currentAnimGroup.stop();
                currentAnimGroup.dispose();
                currentAnimGroup = null;
            }

            if (sourceAg) {
                // Clonar la animación buscando los huesos homónimos en la malla activa (Retargeting)
                currentAnimGroup = new BABYLON.AnimationGroup("activeRetargetedAnim");

                sourceAg.targetedAnimations.forEach(ta => {
                    const targetBone = scene.transformNodes.find(n => n.name === ta.target.name) || 
                                       scene.getBoneByName(ta.target.name);
                    if (targetBone) {
                        currentAnimGroup.addTargetedAnimation(ta.animation, targetBone);
                    }
                });

                currentAnimGroup.speedRatio = animSpeed;
                currentAnimGroup.play(true); // Loop continuo
                sourceAg.dispose();
            }

            // Eliminar la malla auxiliar importada para la animación
            tempRes.meshes.forEach(m => m.dispose());
            if (tempRes.skeletons) tempRes.skeletons.forEach(s => s.dispose());

            updateStatusCard();
        } catch (err) {
            console.error("Error aplicando animación:", err);
        } finally {
            if (showLoading) loading.style.display = "none";
        }
    };

    const applyXRayState = () => {
        activeMeshGroup.forEach(m => {
            if (m.material) {
                m.isVisible = !isXRay;
            }
        });
        if (skeletonViewer) {
            skeletonViewer.isEnabled = isXRay;
        }
        const btn = document.getElementById("btnSkinning");
        if (isXRay) {
            btn.classList.add("active");
            btn.innerHTML = "✨ MOSTRAR PIEL";
        } else {
            btn.classList.remove("active");
            btn.innerHTML = "💀 MOCAP (Rayos X)";
        }
    };

    // Eventos UI
    document.querySelectorAll(".skin-btn").forEach(btn => {
        btn.onclick = () => {
            const skinKey = btn.dataset.skin;
            if (skinKey !== currentSkinKey) {
                document.querySelectorAll(".skin-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                loadSkin(skinKey);
            }
        };
    });

    document.getElementById("btnSkinning").onclick = () => {
        isXRay = !isXRay;
        applyXRayState();
    };

    document.getElementById("btnCameraReset").onclick = () => {
        camera.setTarget(new BABYLON.Vector3(0, 0.8, 0));
        camera.alpha = Math.PI / 2;
        camera.beta = Math.PI / 2.2;
        camera.radius = 3.8;
    };

    document.getElementById("btnRandom").onclick = () => {
        const skinKeys = Object.keys(skins);
        const randomSkin = skinKeys[Math.floor(Math.random() * skinKeys.length)];
        const randomAnim = animLibrary[Math.floor(Math.random() * animLibrary.length)];

        currentSkinKey = randomSkin;
        currentAnimKey = randomAnim.id;

        document.querySelectorAll(".skin-btn").forEach(b => {
            b.classList.toggle("active", b.dataset.skin === randomSkin);
        });
        updateAnimSelection();

        loadSkin(randomSkin);
    };

    document.querySelectorAll(".speed-btn").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            animSpeed = parseFloat(btn.dataset.speed);
            if (currentAnimGroup) {
                currentAnimGroup.speedRatio = animSpeed;
            }
        };
    });

    window.addEventListener("resize", () => engine.resize());

    // Arranque inicial
    initScene();
    buildAnimList();
    loadSkin(currentSkinKey);

    engine.runRenderLoop(() => {
        if (scene) scene.render();
    });
</script>

</body>
</html>
